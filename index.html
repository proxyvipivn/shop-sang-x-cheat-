      const mainShop = document.getElementById('main-shop');
      const footerNav = document.getElementById('footerNav');
      const tabContent = document.getElementById('tabContent');

      let loadPercent = 0;
      const statuses = ['Đang chuẩn bị shop...', 'Sắp hoàn thành...', 'Thành công!'];
      function updateLoading() {
        if (loadPercent < 100) {
          loadPercent += Math.floor(Math.random() * 4) + 1;
          if (loadPercent > 100) loadPercent = 100;
          progressFill.style.width = loadPercent + '%';
          percentDisplay.textContent = loadPercent + '%';
          if (loadPercent < 40) statusMsg.textContent = statuses[0];
          else if (loadPercent < 85) statusMsg.textContent = statuses[1];
          else statusMsg.textContent = statuses[2];
          if (loadPercent < 100) {
            setTimeout(updateLoading, 40 + Math.random() * 60);
          } else {
            setTimeout(() => {
              loadingScreen.classList.add('hidden');
              mainShop.classList.add('active');
              footerNav.style.display = 'flex';
              document.getElementById('tabContent').innerHTML = '✅ Shop đã sẵn sàng! Chọn mục bên dưới.';
            }, 400);
          }
        }
      }

      window.addEventListener('load', () => {
        loadState();
        updateLoading();
      });

      // ========== TAB FOOTER TRANG 1 ==========
      const tabButtons = document.querySelectorAll('#footerNav button');
      tabButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          tabButtons.forEach(b => b.classList.remove('active-tab'));
          this.classList.add('active-tab');
          loadTabContent(this.dataset.tab);
        });
      });

      function loadTabContent(tab) {
        tabContent.innerHTML = '⏳ Đang tải...';
        tabContent.style.opacity = '0.6';
        setTimeout(() => {
          tabContent.style.opacity = '1';
          switch (tab) {
            case 'shopall':
              tabContent.innerHTML = `<div style="font-size:1.3rem; margin-bottom:12px;">🚀 SHOP ALL</div>
                <div>• SX2 PROXY ADR🚀💠</div><div>• MIGUL BASIC VN🚀💠</div>
                <div>• MIGUL PRO VN🚀💠</div><div>• PROXY VIP V2 🚀💠(All IOS)</div>
                <div>• CHỨNG CHỈ 👑ESGIN💎</div><div>• 1 ACC👤</div>
                <div>• ACC RANK KC TC👤</div><div>• Fix lag ios📲</div>`;
              break;
            case 'price':
              let priceHtml = '<div style="font-size:1.3rem;">💰 BẢNG GIÁ</div>';
              products.forEach(p => {
                priceHtml += `<div style="margin-top:16px; font-weight:bold; color:#a0f0ff;">${p.name}</div>`;
                p.prices.forEach(pr => {
                  const discounted = getDiscountedPrice(pr.value, p.id);
                  const showOriginal = discounted !== pr.value;
                  priceHtml += `<div>• ${pr.label}: ${formatCurrency(discounted)} ${showOriginal ? '<span style="text-decoration:line-through;color:#7a8a9a;">('+formatCurrency(pr.value)+')</span>' : ''} 🛍️</div>`;
                });
                if (p.id === 3) priceHtml += '<div>= ANTIBAN✅ = ALL IOS✅</div>';
                if (p.id === 7) priceHtml += '<div>= Toàn bộ đều chứng chỉ 1 năm</div>';
              });
              tabContent.innerHTML = priceHtml;
              break;
            case 'features':
              tabContent.innerHTML = `<div style="font-weight:bold;color:#b3f0ff;">⚙️ CHI TIẾT CHỨC NĂNG</div>
                <div>1️⃣ SX2 PROXY ADR: Chạy nhanh, bắn định phun đỏ, nâng cấp siêu vip⚜️</div>
                <div>2️⃣ MIGUL BASIC VN: Menu bật tắt, viền tâm, bắn đỏ+vàng⚜️</div>
                <div>3️⃣ MIGUL PRO VN: Antiban tuyệt đối, chỉnh vòng✅</div>
                <div>4️⃣ PROXY VIP V2: AIM DRAG/BODY/NECK/MAGIC, xuyên giáp🚀</div>
                <div>5️⃣ Fix lag IOS: fix lag tạm thời, antiban 100%📲</div>
                <div>6️⃣ ACC FF: clone lv5-8, rank KC TC lv8-11👤</div>`;
              break;
            case 'admin':
              tabContent.innerHTML = `<div>👑 THÔNG TIN ADMIN</div>
                <div>ZALO: <b>0372822927</b></div>
                <div>BOX: <a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank" style="color:#7de0ff;">https://zalo.me/g/myvfgfidweld9ovmd7t4</a></div>
                <div>NGÂN HÀNG: MB BANK</div>
                <div>STK: 0372822927 - TRAN TRUNG SANG</div>
                <div>Nội dung: AIM GÌ VÀ MUA BẢNG AIM ĐÓ</div>
                <div>Chuyển khoản xong gửi ảnh qua Zalo admin.</div>`;
              break;
          }
        }, 1000 + Math.random() * 1500);
      }

      // ========== TRANG 2 ==========
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const page2Loading = document.getElementById('page2Loading');
      const page2Main = document.getElementById('page2Main');

      function showPage2() {
        page1.style.display = 'none';
        page2.classList.add('active');
        page2Loading.classList.remove('hidden');
        page2Main.classList.remove('active');
        let blinks = 0;
        const maxBlinks = 5 + Math.floor(Math.random() * 6);
        const blinkInterval = setInterval(() => {
          blinks++;
          if (blinks >= maxBlinks) {
            clearInterval(blinkInterval);
            page2Loading.classList.add('hidden');
            page2Main.classList.add('active');
            document.getElementById('userNickDisplay').textContent = appState.userNick;
            loadVipTab('napvip');
          }
        }, 600);
      }

      document.getElementById('exitPage2').addEventListener('click', () => {
        page2.classList.remove('active');
        page2Main.classList.remove('active');
        page1.style.display = 'block';
        mainShop.classList.add('active');
        footerNav.style.display = 'flex';
      });

      // ========== NÚT NỔI: ADMIN (ZALO) + HACH VIP ==========
      const adminBtn = document.createElement('button');
      adminBtn.className = 'admin-float-btn';
      adminBtn.innerHTML = '👤 ADMIN';
      adminBtn.title = 'Liên hệ Zalo Admin';
      adminBtn.addEventListener('click', () => {
        window.open('https://zalo.me/0372822927', '_blank');
      });
      document.body.appendChild(adminBtn);

      const hachBtn = document.createElement('button');
      hachBtn.className = 'hach-float-btn';
      hachBtn.innerHTML = '🎁 NHẬN HACH VIP';
      hachBtn.addEventListener('click', showPage2);
      document.body.appendChild(hachBtn);

      // ========== TAB TRONG TRANG 2 ==========
      const vipTabBtns = document.querySelectorAll('.vip-tab-btn');
      const vipTabContent = document.getElementById('vipTabContent');
      vipTabBtns.forEach(b => {
        b.addEventListener('click', function() {
          vipTabBtns.forEach(x => x.classList.remove('active'));
          this.classList.add('active');
          loadVipTab(this.dataset.vtab);
        });
      });

      function loadVipTab(tab) {
        switch (tab) {
          case 'napvip':
            vipTabContent.innerHTML = `<div>👑 NẠP VIP</div>
              <div>Gói 1 (40k / 3 ngày) - giảm 9%</div>
              <div>Gói 2 (90k / 8 ngày) - giảm 18%</div>
              <div>Gói 3 (150k / 14 ngày) - giảm 25%</div>
              <div>Gói 4 (250k / 23 ngày) - giảm 36%</div>
              <div>Gói 5 SIÊU VIP+ (800k / Vĩnh viễn) - giảm 50%</div>
              <div style="margin-top:15px;">Liên hệ ZALO: 0372822927 để mua.</div>`;
            break;
          case 'muavoucher':
            vipTabContent.innerHTML = `<div>🛍️ MUA VOUCHER GIẢM GIÁ</div>
              <div>Chuyển khoản MB BANK: 0372822927 - TRAN TRUNG SANG</div>
              <div>Nội dung: Gói vip + tên người mua</div>
              <div>Sau đó liên hệ ZALO admin để nhận voucher.</div>`;
            break;
          case 'nhapvoucher':
            vipTabContent.innerHTML = `<div>🎫 NHẬP VOUCHER</div>
              <div class="voucher-input-area">
                <input type="text" id="voucherCodeInput" placeholder="Nhập mã voucher...">
                <button id="applyVoucherBtn">ÁP DỤNG</button>
              </div>
              <div id="voucherMessage" style="margin-top:15px;"></div>`;
            document.getElementById('applyVoucherBtn').addEventListener('click', applyVoucher);
            break;
        }
      }

      function applyVoucher() {
        const codeInput = document.getElementById('voucherCodeInput');
        const msgDiv = document.getElementById('voucherMessage');
        if (!codeInput) return;
        const code = codeInput.value.trim().toUpperCase();
        if (!code) { msgDiv.innerHTML = '❌ Vui lòng nhập mã voucher.'; return; }
        if (appState.usedVouchers.includes(code)) {
          msgDiv.innerHTML = '⚠️ Voucher này đã được sử dụng trước đó.';
          return;
        }
        let foundPackage = null;
        let discountPercent = 0;
        for (let [pkg, codes] of Object.entries(voucherPool)) {
          if (codes.includes(code)) {
            foundPackage = pkg;
            if (pkg === 'G1') discountPercent = 9;
            else if (pkg === 'G2') discountPercent = 18;
            else if (pkg === 'G3') discountPercent = 25;
            else if (pkg === 'G4') discountPercent = 36;
            else if (pkg === 'G5') discountPercent = 50;
            break;
          }
        }
        if (!foundPackage) {
          msgDiv.innerHTML = '❌ Mã voucher không tồn tại trong hệ thống.';
          return;
        }
        let days = 0;
        if (foundPackage === 'G1') days = 3;
        else if (foundPackage === 'G2') days = 8;
        else if (foundPackage === 'G3') days = 14;
        else if (foundPackage === 'G4') days = 23;
        const now = Date.now();
        const expiresAt = foundPackage === 'G5' ? Infinity : now + days * 24 * 60 * 60 * 1000;
        appState.activeVoucher = {
          code,
          package: foundPackage,
          discountPercent,
          activatedAt: now,
          expiresAt
        };
        appState.usedVouchers.push(code);
        saveState();
        const expStr = foundPackage === 'G5' ? 'VĨNH VIỄN' : 'đến ' + new Date(expiresAt).toLocaleDateString('vi-VN');
        msgDiv.innerHTML = `✅ Voucher <b>${code}</b> áp dụng thành công!<br>Giảm <b>${discountPercent}%</b> (${expStr}).`;
        if (document.querySelector('#footerNav button.active-tab')?.dataset.tab === 'price') {
          loadTabContent('price');
        }
      }

      setInterval(() => {
        if (appState.activeVoucher && appState.activeVoucher.package !== 'G5' && Date.now() > appState.activeVoucher.expiresAt) {
          appState.activeVoucher = null;
          saveState();
        }
      }, 60000);

      document.querySelector('#footerNav button[data-tab="shopall"]')?.click();
    })();
  </script>
</body>
</html>
