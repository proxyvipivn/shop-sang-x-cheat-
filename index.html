<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SHOP ALL FREE FIRE TRUNGSANG X CHEAT</title>
  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: #0a1120;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Nền sóng biển nhẹ + hiệu ứng lướt sóng */
    .ocean-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, #0b2b4a, #021023);
      z-index: 0;
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100px;
      background: repeating-linear-gradient(transparent 0px, rgba(50, 180, 255, 0.08) 4px, transparent 8px);
      animation: drift 12s linear infinite;
      opacity: 0.7;
    }

    .wave:nth-child(2) {
      bottom: 10px;
      animation-duration: 18s;
      opacity: 0.5;
      background: repeating-linear-gradient(transparent 0px, rgba(0, 200, 250, 0.1) 3px, transparent 6px);
    }

    @keyframes drift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Hiệu ứng hạt tuyết nhẹ (tết rơi) */
    .snow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .snowflake {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(100, 200, 255, 0.9);
      animation: fall linear infinite;
      bottom: 100%;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
    }

    /* Màn hình chào mừng */
    #welcome-screen {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 20, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .welcome-text {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      color: #ff3333;
      text-shadow: 0 0 25px #ff0000, 0 0 45px #cc0000, 0 0 60px #ff4444;
      letter-spacing: 2px;
      animation: fadePulse 1.2s ease-out;
      text-align: center;
      padding: 0 20px;
    }

    @keyframes fadePulse {
      0% { opacity: 0; transform: scale(0.9); text-shadow: 0 0 5px #ff0000; }
      100% { opacity: 1; transform: scale(1); text-shadow: 0 0 30px #ff3333, 0 0 50px #ff0000; }
    }

    .progress-container {
      margin-top: 40px;
      width: 280px;
      max-width: 70vw;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 20px #ff000080;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff6666, #ff0000, #cc0000);
      border-radius: 20px;
      box-shadow: 0 0 25px #ff3333;
      transition: width 0.1s linear;
    }

    .status-text {
      color: #ffffff;
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: 500;
      text-shadow: 0 0 15px #ffffff, 0 0 25px #ff6666;
    }

    /* Trang chính shop */
    .main-shop {
      position: relative;
      z-index: 20;
      width: 95%;
      max-width: 1300px;
      background: rgba(8, 26, 45, 0.5);
      backdrop-filter: blur(20px);
      border-radius: 50px;
      padding: 25px 25px 20px;
      box-shadow: 0 30px 60px rgba(255, 0, 0, 0.25), 0 0 0 2px rgba(255, 50, 50, 0.4);
      margin: 30px 0;
      border: 1px solid rgba(255, 0, 0, 0.3);
      animation: shopGlow 4s infinite alternate;
    }

    @keyframes shopGlow {
      0% { box-shadow: 0 0 20px #ff000066, 0 0 0 2px #ff444480; }
      100% { box-shadow: 0 0 45px #ff3333aa, 0 0 0 3px #ff6666; }
    }

    .shop-title {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 20px #ffffff, 0 0 35px #ff3333, 0 0 50px #ff0000;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 25px 0 20px;
    }

    .tab-btn {
      background: rgba(30, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border: 2px solid #ff0000;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #ff0000, 0 0 25px #cc0000;
      text-transform: uppercase;
      background: linear-gradient(145deg, #3d0000, #5c0000);
      text-shadow: 0 0 10px #ffffff;
    }

    .tab-btn i {
      margin-right: 8px;
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff;
    }

    .tab-btn:hover {
      border-color: #ff6666;
      box-shadow: 0 0 30px #ff4444, 0 0 45px #ff0000;
      color: #ffffff;
      transform: translateY(-2px);
      background: linear-gradient(145deg, #5c0000, #7a0000);
    }

    .tab-btn.active {
      background: #ff000020;
      border-color: #ffffff;
      box-shadow: 0 0 35px #ff3333, 0 0 50px #ff0000;
      color: #ffffff;
    }

    .tab-content {
      background: rgba(20, 0, 0, 0.55);
      backdrop-filter: blur(25px);
      border-radius: 40px;
      padding: 25px;
      border: 1px solid #ff3333;
      min-height: 320px;
      transition: 0.4s;
      box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.2);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .card {
      background: rgba(30, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 28px;
      padding: 20px;
      border: 1px solid #ff4444;
      box-shadow: 0 0 18px #ff0000, 0 0 30px #cc0000;
      transition: 0.3s;
      color: #ffffff;
      text-shadow: 0 0 8px #ffffff, 0 0 15px #ff9999;
    }

    .card:hover {
      box-shadow: 0 0 35px #ff3333, 0 0 50px #ff0000;
      border-color: #ff9999;
      transform: translateY(-3px);
    }

    .product-title {
      font-size: 1.5rem;
      color: #ffffff;
      text-shadow: 0 0 12px #ffffff, 0 0 20px #ff4444;
    }

    .price-list {
      margin: 15px 0;
      color: #ffffff;
      text-shadow: 0 0 6px #ffffff;
    }

    .admin-info {
      color: #ffffff;
      background: #1a0000;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid #ff4444;
      box-shadow: 0 0 20px #ff0000;
      text-shadow: 0 0 8px #ffffff;
    }

    .hidden {
      display: none;
    }

    .footer-note {
      margin-top: 30px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 15px #ff6666, 0 0 25px #ff0000;
      font-weight: 600;
      letter-spacing: 1px;
    }

    button, .zalo-link {
      background: #66000030;
      border: 1px solid #ff4444;
      padding: 8px 18px;
      border-radius: 30px;
      color: #ffffff;
      display: inline-block;
      margin: 5px;
      text-decoration: none;
      text-shadow: 0 0 8px #ffffff;
      box-shadow: 0 0 10px #ff0000;
      transition: 0.3s;
    }

    .zalo-link:hover {
      background: #990000;
      box-shadow: 0 0 25px #ff3333;
    }

    strong {
      color: #ffffff;
      text-shadow: 0 0 12px #ffffff, 0 0 20px #ff6666;
    }

    h2 {
      color: #ffffff;
      text-shadow: 0 0 15px #ffffff, 0 0 30px #ff4444;
    }

    .section-title {
      color: #ffffff;
      text-shadow: 0 0 15px #ffffff, 0 0 25px #ff3333;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="ocean-bg">
  <div class="wave"></div>
  <div class="wave"></div>
</div>
<div class="snow-container" id="snowContainer"></div>

<!-- MÀN HÌNH CHÀO MỪNG + TIẾN TRÌNH -->
<div id="welcome-screen">
  <div class="welcome-text" id="welcomeMsg">CHÀO MỪNG ĐẾN VỚI SHOP ALL FREE FIRE TRUNGSANG X CHEAT🚀💹</div>
  <div class="progress-container">
    <div class="progress-bar" id="progressFill"></div>
  </div>
  <div class="status-text" id="statusMessage">0% đang phát triển...</div>
</div>

<!-- SHOP CHÍNH (ban đầu ẩn) -->
<div id="shopContainer" class="main-shop hidden">
  <div class="shop-title">⚡ SHOP ALL FREE FIRE ⚡</div>

  <!-- Các tab điều hướng -->
  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="shop-all"><i class="fas fa-store"></i> SHOP ALL</button>
    <button class="tab-btn" data-tab="pricing"><i class="fas fa-tags"></i> GIÁ/ALL SP</button>
    <button class="tab-btn" data-tab="functions"><i class="fas fa-cogs"></i> CHỨC NĂNG</button>
    <button class="tab-btn" data-tab="admin"><i class="fas fa-user-shield"></i> THÔNG TIN ADMIN</button>
  </div>

  <!-- Nội dung tab -->
  <div class="tab-content" id="tabContent">
    <!-- Mặc định shop all -->
  </div>
  <div class="footer-note">🚀 TRUNGSANG X CHEAT • Uy tín - Chất lượng</div>
</div>

<script>
  (function() {
    // ------ HIỆU ỨNG TUYẾT RƠI ------
    function createSnow() {
      const container = document.getElementById('snowContainer');
      for (let i = 0; i < 60; i++) {
        let flake = document.createElement('div');
        flake.classList.add('snowflake');
        let size = Math.random() * 6 + 2;
        flake.style.width = size + 'px';
        flake.style.height = size + 'px';
        flake.style.left = Math.random() * 100 + '%';
        flake.style.animationDuration = Math.random() * 7 + 5 + 's';
        flake.style.animationDelay = Math.random() * 8 + 's';
        container.appendChild(flake);
      }
    }
    createSnow();

    // ------ CHÀO MỪNG & TIẾN TRÌNH ------
    const welcomeScreen = document.getElementById('welcome-screen');
    const progressFill = document.getElementById('progressFill');
    const statusMsg = document.getElementById('statusMessage');
    const shopContainer = document.getElementById('shopContainer');
    const welcomeText = document.getElementById('welcomeMsg');

    // Hiệu ứng chữ dần xuất hiện (đã có sẵn css), sau 3 giây ẩn dòng chào
    setTimeout(() => {
      welcomeText.style.opacity = '0';
      welcomeText.style.transition = 'opacity 0.8s';
      setTimeout(() => { welcomeText.innerText = ''; }, 800);
    }, 3000);

    // Bắt đầu tiến trình 0% -> 100%
    let percent = 0;
    const messages = [
      "0% đang phát triển...",
      "Đang vô wed để vào shop...",
      "Đang chuẩn bị shop...",
      "Sắp hoàn thành...",
      "Hoàn thành công!"
    ];

    const interval = setInterval(() => {
      percent += Math.floor(Math.random() * 4) + 2;
      if (percent >= 100) {
        percent = 100;
        progressFill.style.width = '100%';
        statusMsg.innerText = "Hoàn thành công. ✅";
        clearInterval(interval);
        // Sau khi đạt 100%, hiện shop sau 0.5s
        setTimeout(() => {
          welcomeScreen.style.opacity = '0';
          setTimeout(() => {
            welcomeScreen.style.display = 'none';
            shopContainer.classList.remove('hidden');
          }, 600);
        }, 500);
      } else {
        progressFill.style.width = percent + '%';
        if (percent < 30) statusMsg.innerText = messages[0];
        else if (percent < 55) statusMsg.innerText = messages[1];
        else if (percent < 75) statusMsg.innerText = messages[2];
        else if (percent < 95) statusMsg.innerText = messages[3];
        else statusMsg.innerText = messages[4];
      }
    }, 180);

    // ------ NỘI DUNG CÁC TAB ------
    function renderTab(tabId) {
      const content = document.getElementById('tabContent');
      switch(tabId) {
        case 'shop-all':
          content.innerHTML = `
            <div class="section-title">✨ DANH MỤC SẢN PHẨM</div>
            <div class="product-grid">
              <div class="card"><i class="fas fa-rocket"></i> <strong>SX2 PROXY ADR🚀💠</strong></div>
              <div class="card"><i class="fas fa-bolt"></i> <strong>MIGUL BASIC VN🚀💠</strong></div>
              <div class="card"><i class="fas fa-crown"></i> <strong>MIGUL PRO VN🚀💠</strong></div>
              <div class="card"><i class="fas fa-shield-alt"></i> <strong>PROXY VIP V2 🚀💠(All IOS)</strong></div>
              <div class="card"><i class="fas fa-certificate"></i> <strong>CHỨNG CHỈ 👑ESGIN💎</strong></div>
            </div>
          `;
          break;
        case 'pricing':
          content.innerHTML = `
            <div class="section-title">💰 BẢNG GIÁ CHI TIẾT</div>
            <div class="product-grid">
              <div class="card"><strong>SX2 PROXY ADR💠</strong><br>33.000 VNĐ 1 DAY⚜️<br>66.000 VNĐ 7 DAY⚜️<br>125.000 VNĐ 14 DAY⚜️<br>220.000 VNĐ 30 DAY⚜️</div>
              <div class="card"><strong>MIGUL BASIC VN💠</strong><br>65.000 VNĐ 1 DAY🛍️<br>145.000 VNĐ 7 DAY🛍️<br>300.000 VNĐ 30 DAY🛍️</div>
              <div class="card"><strong>MIGUL PRO VN💠</strong><br>20.000 VNĐ 1 GIỜ🛍️<br>130.000 VNĐ 1 DAY🛍️<br>250.000 VNĐ 7 DAY🛍️<br>536.000 VNĐ 30 DAY🛍️<br>ANTIBAN✅ ALL IOS✅</div>
              <div class="card"><strong>PROXY VIP V2💠 (ALL AIM)</strong><br>20.000 VNĐ 1 DAY 🛍️<br>70.000 VNĐ 7 DAY🛍️<br>140.000 VNĐ 30 DAY🛍️<br>290.000 VNĐ 1 OB 🛍️<br>610.000 VNĐ VĨNH VIỄN 🛍️</div>
              <div class="card"><strong>💹ESGIN 💎</strong><br>• 140.000 VND🛍️ (Gói iPhone/iPad lấy ngay, không BH)<br>• 300.000 VND🛍️ (BH 40 ngày)<br>• 610.000 VND🛍️ (BH 300 ngày)<br>Toàn bộ chứng chỉ 1 năm</div>
            </div>
          `;
          break;
        case 'functions':
          content.innerHTML = `
            <div class="section-title">⚙️ CHỨC NĂNG CHI TIẾT</div>
            <div class="product-grid">
              <div class="card"><strong>1 SX2 PROXY ADR🚀</strong><br>Toàn diện ADR nâng cấp siêu vip⚜️💹</div>
              <div class="card"><strong>2 MIGUL BASIC VN🚀</strong><br>Menu bật tắt, viền tâm, bắn đỏ+vàng, định vị, leo rank... nâng cấp xịn⚜️</div>
              <div class="card"><strong>3 MIGUL PRO VN 🚀</strong><br>Chỉnh vòng, Antiban tuyệt đối, bắn đỏ+vàng, định vị...⚜️</div>
              <div class="card"><strong>4 PROXY VIP V2 (All AIM) 🚀</strong><br>AIM DRAG/BODY/NECK/MAGIC, xuyên giáp, MOD... Tải ipa cho iPhone📱</div>
            </div>
          `;
          break;
        case 'admin':
          content.innerHTML = `
            <div class="admin-info">
              <h2>👑 THÔNG TIN ADMIN 👾</h2>
              <p><i class="fas fa-phone"></i> ZALO ADMIN: <strong>0372822927</strong></p>
              <p><i class="fas fa-users"></i> BOX: <a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank" class="zalo-link">Nhấp vào Box Zalo</a></p>
              <p>Vui lòng liên hệ ADMIN để mua 🛍️</p>
              <p>Chuyển khoản:<br><strong>STK: 0372822927</strong><br>TRAN TRUNG SANG<br>Nội dung: Aim + số tiền</p>
            </div>
          `;
          break;
        default: break;
      }
    }

    // Mặc định hiển thị shop-all
    renderTab('shop-all');

    // Xử lý click tab (có delay 1-3 giây như yêu cầu)
    const tabButtons = document.querySelectorAll('.tab-btn');
    tabButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const tabId = this.getAttribute('data-tab');
        // Active style
        tabButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        // Hiệu ứng loading nhẹ trước khi load (1-3 giây random)
        const contentDiv = document.getElementById('tabContent');
        contentDiv.style.opacity = '0.4';
        const delay = Math.floor(Math.random() * 2000) + 1000; // 1000-3000ms
        setTimeout(() => {
          renderTab(tabId);
          contentDiv.style.opacity = '1';
        }, delay);
      });
    });

    // Thêm link Zalo trực tiếp (số)
    window.openZalo = function() {
      window.open('https://zalo.me/0372822927', '_blank');
    }
  })();
</script>
</body>
</html>
