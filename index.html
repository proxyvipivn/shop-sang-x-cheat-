<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>SHOP ALL FREE FIRE | TRUNGSANG X CHEAT 🚀💹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0a0f14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
      position: relative;
    }

    /* nền chuyển động 7 sắc cầu vồng nhẹ */
    .rainbow-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg,
          #ff0000, #ff8800, #ffff00, #00ff40, #0099ff, #6a00ff, #cc00ff,
          #ff0000);
      background-size: 600% 600%;
      animation: rainbowMove 18s ease infinite;
      z-index: -2;
      opacity: 0.15;
    }

    @keyframes rainbowMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* hạt lấp lánh nền */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* khung chính */
    .main-container {
      width: 100%;
      max-width: 750px;
      background: rgba(10, 18, 25, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 25px 20px 20px;
      box-shadow: 0 0 40px rgba(0, 180, 255, 0.4), 0 0 80px rgba(138, 43, 226, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
      position: relative;
      transition: all 0.3s;
      animation: borderRainbow 6s linear infinite;
    }

    @keyframes borderRainbow {
      0% {
        border-color: #ff4d6d;
        box-shadow: 0 0 30px #ff4d6d, 0 0 50px #ffb347;
      }
      16% {
        border-color: #ffb347;
        box-shadow: 0 0 30px #ffb347, 0 0 50px #ffe600;
      }
      33% {
        border-color: #ffe600;
        box-shadow: 0 0 30px #ffe600, 0 0 50px #3ae374;
      }
      50% {
        border-color: #3ae374;
        box-shadow: 0 0 30px #3ae374, 0 0 50px #17c0eb;
      }
      66% {
        border-color: #17c0eb;
        box-shadow: 0 0 30px #17c0eb, 0 0 50px #7158e2;
      }
      83% {
        border-color: #7158e2;
        box-shadow: 0 0 30px #7158e2, 0 0 50px #ff4d6d;
      }
      100% {
        border-color: #ff4d6d;
        box-shadow: 0 0 30px #ff4d6d, 0 0 50px #ffb347;
      }
    }

    /* chữ phát sáng xanh nhạt */
    .glow-text {
      color: #b5f0ff;
      text-shadow: 0 0 12px #00e0ff, 0 0 25px #00b7ff, 0 0 40px #0099ff;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .title-main {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      text-align: center;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .sub-title {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 25px;
      color: #b5f0ff;
      text-shadow: 0 0 10px #00ccff;
    }

    /* loading bar */
    .loading-wrapper {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 40px;
      padding: 3px;
      margin: 15px 0 25px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 18px #00ffff55;
    }

    .progress-bar {
      height: 28px;
      background: linear-gradient(90deg, #00f2fe, #4facfe, #00ff88);
      background-size: 200% 100%;
      border-radius: 40px;
      width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 25px #0ff;
      position: relative;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .status-text {
      text-align: center;
      margin: 8px 0 5px;
      font-weight: 600;
      color: #b5f0ff;
      text-shadow: 0 0 10px #00ccff;
    }

    /* nút menu dưới */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 15px;
    }

    .nav-btn {
      background: rgba(20, 30, 40, 0.8);
      backdrop-filter: blur(12px);
      border: 1.5px solid #ffffff55;
      color: #e0f7ff;
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.25s;
      text-shadow: 0 0 8px #00ccff;
      box-shadow: 0 0 15px #00a6ff4d;
      letter-spacing: 0.3px;
      flex: 1 0 auto;
    }

    .nav-btn:hover {
      background: #00a6ff30;
      border-color: #0ff;
      box-shadow: 0 0 30px #0ff;
      transform: translateY(-2px);
    }

    /* khu vực nội dung hiển thị */
    .content-box {
      background: rgba(0, 8, 18, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 18px;
      min-height: 280px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 0 35px rgba(0, 180, 255, 0.3);
      transition: 0.3s;
      color: #d4f4ff;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 0.95rem;
      word-break: break-word;
      text-shadow: 0 0 6px #0099dd;
      overflow-y: auto;
      max-height: 500px;
    }

    .product-item {
      margin-bottom: 20px;
      border-bottom: 1px dashed #4facfe;
      padding-bottom: 12px;
    }

    .highlight {
      color: #ffe484;
      text-shadow: 0 0 8px #ffb700;
    }

    a {
      color: #8ad4ff;
      text-decoration: none;
      border-bottom: 1px dotted;
      font-weight: 600;
    }

    a:hover {
      color: #ffffff;
      text-shadow: 0 0 15px white;
    }

    hr {
      border: 0.5px solid #336699;
      margin: 12px 0;
    }

    @media (max-width: 500px) {
      .nav-btn {
        padding: 10px 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
<div class="rainbow-bg"></div>
<div class="particles" id="particles"></div>

<div class="main-container">
  <h1 class="glow-text title-main">SHOP ALL FREE FIRE</h1>
  <h2 class="glow-text sub-title">TRUNGSANG X CHEAT🚀💹</h2>

  <!-- Thanh loading + trạng thái -->
  <div class="loading-wrapper">
    <div id="progressFill" class="progress-bar" style="width: 0%;"></div>
  </div>
  <div id="statusMessage" class="status-text">0% - Đang chuẩn bị shop...</div>

  <!-- Các nút menu chính -->
  <div class="nav-buttons">
    <button class="nav-btn" data-page="shop">🏪 SHOP ALL</button>
    <button class="nav-btn" data-page="price">💰 GIÁ/ALL SP</button>
    <button class="nav-btn" data-page="features">⚙️ CHỨC NĂNG CHI TIẾT</button>
    <button class="nav-btn" data-page="admin">👑 THÔNG TIN ADMIN</button>
  </div>

  <!-- Nội dung động -->
  <div id="dynamicContent" class="content-box">
    <p style="text-align:center; opacity:0.8;">✨ Chọn một mục bên trên để hiển thị ✨</p>
  </div>
  <div style="text-align:right; margin-top:10px; font-size:0.8rem; color:#87ceeb;">⚡ TRUNGSANG ⚡</div>
</div>

<script>
  (function() {
    // --- LOADING GIẢ LẬP 0% -> 100% ---
    const progressFill = document.getElementById('progressFill');
    const statusMessage = document.getElementById('statusMessage');
    let currentPercent = 0;
    const interval = setInterval(() => {
      currentPercent += 1;
      if (currentPercent > 100) {
        currentPercent = 100;
        clearInterval(interval);
        statusMessage.textContent = '✅ Thành công. Shop đã sẵn sàng!';
      } else if (currentPercent < 50) {
        statusMessage.textContent = currentPercent + '% - Đang chuẩn bị shop...';
      } else if (currentPercent < 90) {
        statusMessage.textContent = currentPercent + '% - Sắp hoàn thành...';
      } else if (currentPercent < 100) {
        statusMessage.textContent = currentPercent + '% - Gần xong...';
      }

      progressFill.style.width = currentPercent + '%';

      if (currentPercent === 100) {
        statusMessage.textContent = '100% - Thành công.';
        // Sau khi đạt 100%, chữ "SHOP ALL FREE FIRE..." vẫn hiển thị, chữ loading biến mất dần? 
        // Yêu cầu: khi đầy 100% sẽ hết chữ "tiếp theo đếm từ 0% đến 100%". Ở đây giữ thông báo thành công.
      }
    }, 55); // tốc độ load ~ 5.5 giây từ 0-100

    // --- NỘI DUNG CÁC TRANG ---
    const contentData = {
      shop: `
        <div class="product-item"><strong>🚀💠 SX2 PROXY ADR</strong></div>
        <div class="product-item"><strong>🚀💠 MIGUL BASIC VN</strong></div>
        <div class="product-item"><strong>🚀💠 MIGUL PRO VN</strong></div>
        <div class="product-item"><strong>🚀💠 PROXY VIP V2 (All IOS)</strong></div>
        <div class="product-item"><strong>👑 CHỨNG CHỈ ESGIN 💎</strong></div>
        <div class="product-item"><strong>👤 1 ACC</strong></div>
        <div class="product-item"><strong>👤 ACC RANK KC TC</strong></div>
        <div class="product-item"><strong>📲 Fix lag ios</strong></div>
      `,
      price: `
        <div class="product-item"><strong>💠 SX2 PROXY ADR</strong><br>
        ⚜️ 20.000 VNĐ 1 DAY<br>⚜️ 50.000 VNĐ 7 DAY<br>⚜️ 100.000 VNĐ 14 DAY<br>⚜️ 180.000 VNĐ 30 DAY</div>
        <div class="product-item"><strong>💠 MIGUL BASIC VN</strong><br>
        🛍️ 65.000 VNĐ 1 DAY<br>🛍️ 145.000 VNĐ 7 DAY<br>🛍️ 300.000 VNĐ 30 DAY</div>
        <div class="product-item"><strong>💠 MIGUL PRO VN</strong><br>
        🛍️ 20.000 VNĐ 1 GIỜ<br>🛍️ 130.000 VNĐ 1 DAY<br>🛍️ 250.000 VNĐ 7 DAY<br>🛍️ 536.000 VNĐ 30 DAY<br>
        ✅ ANTIBAN ✅ ALL IOS</div>
        <div class="product-item"><strong>💠 PROXY VIP V2 (ALL AIM)</strong><br>
        🛍️ 24.000 VNĐ 1 DAY<br>🛍️ 54.000 VNĐ 7 DAY<br>🛍️ 115.000 VNĐ 30 DAY<br>🛍️ 300.000 VNĐ VĨNH VIỄN</div>
        <div class="product-item"><strong>📲 Fix lag ios</strong><br>🛍️ 90.000 Vĩnh viễn</div>
        <div class="product-item"><strong>🔱 Acc FF</strong><br>👤 1 ACC - 13.000 VND<br>👤 ACC RANK KC TC - 80.000 VND</div>
        <div class="product-item"><strong>💎 ESGIN</strong><br>
        • 140.000 VND (Gói iPhone/iPad lấy ngay, không bảo hành)<br>
        • 300.000 VND (BH 40 ngày)<br>
        • 600.000 VND (BH 300 ngày)<br>
        = Toàn bộ chứng chỉ 1 năm</div>
      `,
      features: `
        <div class="product-item"><strong>🚀 1. SX2 PROXY ADR</strong><br>• Chạy nhanh • Bắn định phun đỏ • Nhiều chức năng khác • Siêu vip nâng cấp ⚜️💹</div>
        <div class="product-item"><strong>🚀 2. MIGUL BASIC VN</strong><br>• Menu bật tắt • Viền tâm bắn • Bắn đỏ+vàng • Định vị địch • Leo rank • Nâng cấp xịn sò ⚜️</div>
        <div class="product-item"><strong>🚀 3. MIGUL PRO VN</strong><br>• Menu chỉnh vòng • Viền tâm • Đỏ+vàng • Định vị • Antiban tuyệt đối ✅ • Siêu vip ⚜️</div>
        <div class="product-item"><strong>🚀 4. PROXY VIP V2 (All AIM)</strong><br>AIM DRAG, AIM BODY, AIM NECK, AIM DRAG V2, AIM MAGIC, AIM NECK+MOD, AIM BODY+MOD, XUYÊN GIÁP, AIM BODY+ANTENA, AIM NECK+ANTENA, MOD+ƯỚC ĐƯỢC BAN</div>
        <div class="product-item"><strong>📲 5. Fix lag IOS</strong><br>Fix lag 1-3s, bắn định thoải mái ✅ ANTIBAN 100%</div>
        <div class="product-item"><strong>🔱 6. ACC FF</strong><br>1 ACC (LV5-8), ACC RANK KC TC (LV8-11), leo rank tử chiến, no ban</div>
      `,
      admin: `
        <div class="product-item"><strong>👑 THÔNG TIN ADMIN</strong><br>
        📞 ZALO: <a href="https://zalo.me/0372822927" target="_blank">0372822927</a><br>
        💬 BOX: <a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank">Nhóm Zalo</a><br>
        🛍️ Vui lòng liên hệ ADMIN để mua.<br>
        💯 Chuyển khoản nhanh:<br>
        🏦 NGÂN HÀNG: MB BANK<br>
        🔢 SỐ TK: 0372822927<br>
        👤 TÊN: TRAN TRUNG SANG<br>
        📝 Nội dung: AIM GÌ VÀ MUA BẢNG AIM ĐÓ<br>
        📸 Chuyển khoản xong gửi ảnh qua Zalo admin.</div>
      `
    };

    const dynamicContent = document.getElementById('dynamicContent');
    const navButtons = document.querySelectorAll('.nav-btn');

    // Hàm hiển thị nội dung với delay 1-3 giây (ngẫu nhiên)
    function displayPage(pageKey) {
      if (!contentData[pageKey]) return;
      dynamicContent.style.opacity = '0.5';
      dynamicContent.innerHTML = '<p style="text-align:center;">⏳ Đang tải...</p>';

      const delay = Math.floor(Math.random() * 2000) + 1000; // 1000-3000ms
      setTimeout(() => {
        dynamicContent.innerHTML = contentData[pageKey];
        dynamicContent.style.opacity = '1';
        dynamicContent.style.transition = 'opacity 0.3s';
      }, delay);
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const page = this.dataset.page;
        if (page) {
          displayPage(page);
        }
      });
    });

    // Mặc định hiển thị shop sau khi load xong? Hay để trống. Có thể tự động click shop sau 100%.
    // Sau khi loading 100% tự động hiện shop all (tùy chọn)
    setTimeout(() => {
      if (currentPercent >= 100) {
        // tự động click shop all nếu muốn
        const shopBtn = document.querySelector('.nav-btn[data-page="shop"]');
        if (shopBtn) shopBtn.click();
      }
    }, 6000); // chờ load hoàn tất

    // Tạo hạt particle nhẹ
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 35; i++) {
      const span = document.createElement('span');
      span.style.position = 'absolute';
      span.style.width = '4px';
      span.style.height = '4px';
      span.style.background = 'rgba(255,255,255,0.7)';
      span.style.borderRadius = '50%';
      span.style.left = Math.random()*100+'%';
      span.style.top = Math.random()*100+'%';
      span.style.animation = `float ${2+Math.random()*4}s infinite alternate`;
      span.style.boxShadow = '0 0 12px #0ff';
      particlesContainer.appendChild(span);
    }
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
      @keyframes float {
        0% { transform: translateY(0px); opacity:0.4; }
        100% { transform: translateY(-20px); opacity:1; }
      }
    `;
    document.head.appendChild(styleSheet);
  })();
</script>
</body>
</html>
