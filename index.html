<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>TRUNGSANG X SHOP 👾 | Shop All Free Fire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Be Vietnam Pro', 'Orbitron', sans-serif;
      background: #0a0f1e;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ===== NÚT ĐIỀU KHIỂN NHẠC ===== */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      background: rgba(0, 40, 70, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid #00a6ff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      color: #00e5ff;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.7);
      transition: 0.3s;
    }
    .music-control:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #00a6ff;
      color: white;
    }

    /* ===== MÀN CHÀO MỪNG ===== */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #141b2b 0%, #02040a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-text {
      font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 7vw, 4rem);
      text-align: center;
      padding: 0 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
      /* Màu trắng đã giảm nhẹ, viền đen, phát sáng dịu hơn */
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.7), 0 0 25px rgba(200, 220, 255, 0.5);
      -webkit-text-stroke: 2px black;
      animation: gentleGlow 2.5s infinite alternate;
      margin-bottom: 40px;
      line-height: 1.3;
    }

    @keyframes gentleGlow {
      0% { text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px #aaccff; }
      100% { text-shadow: 0 0 18px rgba(255,255,255,0.8), 0 0 35px #cce0ff; }
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .progress-bar-bg {
      width: 280px;
      height: 14px;
      background: #1a1f2f;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.7), inset 0 0 5px black;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #c0e0ff, #ffffff, #a0d0ff);
      box-shadow: 0 0 15px #ffffff, 0 0 30px #88aaff;
      border-radius: 30px;
      transition: width 0.1s linear;
    }

    #percentage-text {
      font-weight: 700;
      font-size: 1.8rem;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 0 15px black, 0 0 20px #ffffff;
      letter-spacing: 2px;
    }

    /* ===== SHOP CHÍNH ===== */
    #main-shop {
      display: none;
      padding: 20px 15px 30px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      background: linear-gradient(145deg, #0b1424 0%, #020617 100%);
      min-height: 100vh;
      box-shadow: 0 0 60px rgba(0, 160, 255, 0.25);
    }

    .shop-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
      margin: 20px 0 25px;
      /* Màu xanh phát sáng */
      color: #a0e9ff;
      text-shadow: 0 0 30px #006eff, 0 0 60px #003cff, 0 0 90px #001a99;
      -webkit-text-stroke: 1.8px black;
      letter-spacing: 8px;
      transform: perspective(500px) rotateX(2deg);
    }

    /* ===== LƯỚI MENU 2 CỘT BÊN CẠNH NHAU ===== */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 25px 0 25px;
    }

    .menu-btn {
      background: linear-gradient(135deg, #0a1a3a, #03102a);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(0, 180, 255, 0.4);
      border-radius: 24px;
      padding: 20px 12px;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      color: #e0f0ff;
      text-shadow: 0 0 15px #0088ff, 0 0 30px #0044aa;
      letter-spacing: 1.5px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.8), 0 0 35px rgba(0, 160, 255, 0.5);
      transform: perspective(800px) rotateX(1deg);
      transition: 0.25s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-bottom: 3px solid #00a6ff80;
      word-break: break-word;
      min-height: 110px;
      /* Màu sắc khác nhau cho từng ô */
    }

    /* Từng ô menu màu khác nhau */
    .menu-btn:nth-child(1) { background: linear-gradient(135deg, #0d2b4e, #021530); border-left: 4px solid #ffaa00; }
    .menu-btn:nth-child(2) { background: linear-gradient(135deg, #1a3350, #041a2a); border-left: 4px solid #00e676; }
    .menu-btn:nth-child(3) { background: linear-gradient(135deg, #0e2842, #021225); border-left: 4px solid #ff4081; }
    .menu-btn:nth-child(4) { background: linear-gradient(135deg, #15304a, #031a30); border-left: 4px solid #40c4ff; }
    .menu-btn:nth-child(5) { background: linear-gradient(135deg, #1e2f4a, #081830); border-left: 4px solid #ffd740; }
    .menu-btn:nth-child(6) { background: linear-gradient(135deg, #0f2540, #021020); border-left: 4px solid #b388ff; }
    .menu-btn:nth-child(7) { background: linear-gradient(135deg, #1a2b45, #041828); border-left: 4px solid #ff6e40; }

    .menu-btn i {
      font-size: 2rem;
      filter: drop-shadow(0 0 12px currentColor);
      color: #ffffff;
    }

    .menu-btn:hover {
      transform: scale(1.03) translateY(-4px);
      border-color: #00c8ff;
      box-shadow: 0 0 50px #00a6ffcc, 0 18px 35px black;
    }

    /* ===== KHU VỰC NỘI DUNG SẢN PHẨM (MÀU XANH PHÁT SÁNG) ===== */
    .product-panel {
      background: rgba(0, 15, 35, 0.7);
      backdrop-filter: blur(25px);
      border-radius: 32px;
      padding: 22px 18px;
      margin: 10px 0 30px;
      border: 1.5px solid rgba(0, 180, 255, 0.5);
      box-shadow: 0 25px 45px rgba(0,0,0,0.8), 0 0 50px #004cff55;
    }

    .product-item {
      background: rgba(8, 22, 45, 0.9);
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 22px;
      border-left: 6px solid #00b8ff;
      box-shadow: 0 0 30px #0066ff44, 0 10px 20px black;
      backdrop-filter: blur(10px);
    }

    .product-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #e0f0ff;
      text-shadow: 0 0 22px #0088ff, 0 0 45px #0044cc;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .price-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-weight: 700;
      font-size: 1rem;
      background: #0e2244;
      padding: 10px 15px;
      border-radius: 40px;
      color: #c8e4ff;
      box-shadow: 0 0 12px black;
      border: 1px solid #0088ff40;
    }

    .feature-badge {
      background: #00c853;
      color: black;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 20px;
      margin: 3px;
      display: inline-block;
      box-shadow: 0 0 12px #00ff88;
    }

    .admin-contact {
      background: #071028e0;
      border-radius: 28px;
      padding: 22px;
      text-align: center;
      border: 1px solid #0088ff;
      box-shadow: 0 0 30px #004cff;
    }

    .zalo-btn, .box-btn {
      display: inline-block;
      margin: 8px;
      background: #0066ff;
      padding: 14px 30px;
      border-radius: 50px;
      font-weight: 800;
      color: white;
      text-decoration: none;
      box-shadow: 0 0 28px #0080ff;
      transition: 0.2s;
      border: 1px solid white;
    }

    /* Responsive: mobile xuống 1 cột */
    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Nút nhạc -->
  <div class="music-control" id="music-toggle" title="Bật/Tắt nhạc">
    <i class="fas fa-music"></i>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- MÀN CHÀO -->
  <div id="welcome-screen">
    <div class="welcome-text">CHÀO MỪNG ĐẾN VỚI SHOP ALL FREE FIRE<br>TRUNGSANG X SHOP👾</div>
    <div class="loader-container">
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
      </div>
      <div id="percentage-text">0%</div>
    </div>
  </div>

  <!-- SHOP CHÍNH -->
  <div id="main-shop">
    <div class="shop-title">SHOP ALL</div>

    <div class="menu-grid" id="menu-buttons">
      <div class="menu-btn" data-menu="drip-proxy"><i class="fas fa-bolt"></i> DRIP MENU, PROXY ADR 🚀</div>
      <div class="menu-btn" data-menu="fluorite"><i class="fas fa-gem"></i> FLUORITE 🚀</div>
      <div class="menu-btn" data-menu="migul"><i class="fas fa-rocket"></i> MIGUL LITE / PRO 🚀</div>
      <div class="menu-btn" data-menu="proxyvip"><i class="fas fa-crown"></i> PROXY VIP V2 (All AIM)</div>
      <div class="menu-btn" data-menu="chungchi"><i class="fas fa-certificate"></i> CHỨNG CHỈ ESGIN💎</div>
      <div class="menu-btn" data-menu="allprice"><i class="fas fa-tags"></i> GIÁ/ALL SP 🛍️</div>
      <div class="menu-btn" data-menu="admin"><i class="fas fa-user-shield"></i> THÔNG TIN ADMIN👾</div>
    </div>

    <div id="dynamic-content" class="product-panel">
      <p style="text-align:center; opacity:0.9;">👇 Chọn một ô bên trên để xem sản phẩm</p>
    </div>
  </div>

  <script>
    (function() {
      const welcomeScreen = document.getElementById('welcome-screen');
      const mainShop = document.getElementById('main-shop');
      const progressFill = document.getElementById('progress-fill');
      const percentageText = document.getElementById('percentage-text');
      const bgMusic = document.getElementById('bg-music');
      const musicToggle = document.getElementById('music-toggle');
      const dynamicContent = document.getElementById('dynamic-content');

      let musicPlaying = false;
      function tryPlayMusic() {
        if (!musicPlaying) {
          bgMusic.play().then(() => {
            musicPlaying = true;
            musicToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
          }).catch(() => {});
        }
      }
      musicToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (musicPlaying) {
          bgMusic.pause();
          musicPlaying = false;
          musicToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
        } else {
          bgMusic.play().then(() => {
            musicPlaying = true;
            musicToggle.innerHTML = '<i class="fas fa-volume-up"></i>';
          }).catch(() => alert('Nhấn vào trang để bật nhạc!'));
        }
      });
      document.addEventListener('click', tryPlayMusic, { once: false });

      let loadStarted = false;
      setTimeout(() => {
        if (!loadStarted) { loadStarted = true; startLoading(); }
      }, 5000);

      function startLoading() {
        let percent = 0;
        const interval = setInterval(() => {
          percent += Math.floor(Math.random() * 5) + 2;
          if (percent >= 100) {
            percent = 100;
            clearInterval(interval);
            progressFill.style.width = '100%';
            percentageText.textContent = '100%';
            setTimeout(() => {
              welcomeScreen.style.opacity = '0';
              welcomeScreen.style.visibility = 'hidden';
              mainShop.style.display = 'block';
              tryPlayMusic();
              setTimeout(() => {
                const firstBtn = document.querySelector('.menu-btn[data-menu="drip-proxy"]');
                if (firstBtn) firstBtn.click();
              }, 300);
            }, 400);
          }
          progressFill.style.width = percent + '%';
          percentageText.textContent = percent + '%';
        }, 60);
      }

      const productData = {
        'drip-proxy': `<div class="product-item"><div class="product-name">🔥 DRIP MENU ADR 🚀</div><div class="price-line">180.000 VNĐ 7 DAY🛍️</div><div class="price-line">350.000 VNĐ 30 DAY🛍️</div><span class="feature-badge">ANTIBAN ✅</span><span class="feature-badge">ALL ADR ✅</span></div><div class="product-item"><div class="product-name">🌐 PROXY ADR 🚀</div><div class="price-line">80.000 VNĐ 1 DAY🛍️</div><div class="price-line">160.000 VNĐ 7 DAY🛍️</div><div class="price-line">320.000 VNĐ 30 DAY🛍️</div><span class="feature-badge">ANTIBAN ✅</span></div>`,
        'fluorite': `<div class="product-item"><div class="product-name">💎 FLUORITE 🚀</div><div class="price-line">120.000 VNĐ 1 DAY🛍️</div><div class="price-line">280.000 VNĐ 7 DAY🛍️</div><div class="price-line">520.000 VNĐ 30 DAY🛍️</div><span class="feature-badge">ANTIBAN ✅</span><span class="feature-badge">TIPA ALL IOS ✅</span></div>`,
        'migul': `<div class="product-item"><div class="product-name">⚡ MIGUL LITE 🚀</div><div class="price-line">100K/1D | 300K/7D | 700K/30D</div></div><div class="product-item"><div class="product-name">🚀 MIGUL PRO 🚀</div><div class="price-line">25K/1H | 170K/1D | 310K/7D | 715K/30D</div><span class="feature-badge">ANTIBAN✅</span></div>`,
        'proxyvip': `<div class="product-item"><div class="product-name">🎯 PROXY VIP V2 (ALL AIM)</div><div class="price-line">30K/1D | 110K/7D | 220K/30D 🛍️</div></div>`,
        'chungchi': `<div class="product-item"><div class="product-name">📋 CHỨNG CHỈ ESGIN 💎</div><div class="price-line">160K (không BH) | 280K BH 40 ngày | 320K BH 300 ngày</div><p>Toàn bộ chứng chỉ 1 năm</p></div>`,
        'allprice': `<div class="product-item"><div class="product-name">💰 BẢNG GIÁ ALL</div><div class="price-line">DRIP ADR: 180K/7D - 350K/30D</div><div class="price-line">PROXY ADR: 80K-320K</div><div class="price-line">FLUORITE: 120K-520K</div><div class="price-line">MIGUL LITE/PRO: 25K-715K</div><div class="price-line">PROXY VIP V2: 30K-220K</div></div>`,
        'admin': `<div class="admin-contact"><h3>👾 THÔNG TIN ADMIN</h3><p>ZALO: 0372822927</p><a href="https://zalo.me/0372822927" target="_blank" class="zalo-btn">ZALO ADMIN</a><a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank" class="box-btn">BOX ZALO</a><p>🛍️ Liên hệ Admin để mua hàng</p></div>`
      };

      document.querySelectorAll('.menu-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const key = this.getAttribute('data-menu');
          if (productData[key]) {
            dynamicContent.innerHTML = productData[key];
          }
        });
      });
    })();
  </script>
</body>
</html>
