<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>TRUNGSANG X SHOP 👾 | Shop All Free Fire</title>
  <!-- Font Awesome cho icon và font Google cho chữ đẹp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Be Vietnam Pro', 'Orbitron', sans-serif;
      background: #0a0f1e;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
    }

    /* ===== MÀN HÌNH CHÀO MỪNG + LOADING ===== */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #141b2b 0%, #02040a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-text {
      font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 8vw, 5rem);
      text-align: center;
      padding: 0 15px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: white;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(200, 220, 255, 0.8), 0 0 70px rgba(255, 255, 255, 0.6);
      -webkit-text-stroke: 2.5px black;
      paint-order: stroke fill;
      animation: gentleGlow 2s infinite alternate;
      margin-bottom: 40px;
    }

    @keyframes gentleGlow {
      0% { text-shadow: 0 0 15px white, 0 0 30px #aaccff, 0 0 50px #ffffff; }
      100% { text-shadow: 0 0 25px white, 0 0 50px #cce0ff, 0 0 80px #ffffff; }
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .progress-bar-bg {
      width: 280px;
      height: 14px;
      background: #1a1f2f;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.7), inset 0 0 5px black;
      border: 1px solid #ffffff33;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f0f9ff, #ffffff, #d4e4ff);
      box-shadow: 0 0 20px #ffffff, 0 0 40px #88aaff;
      border-radius: 30px;
      transition: width 0.1s linear;
    }

    #percentage-text {
      font-weight: 700;
      font-size: 1.8rem;
      color: white;
      text-shadow: 0 0 15px black, 0 0 20px #ffffff;
      letter-spacing: 2px;
    }

    /* ===== SHOP CHÍNH (ẩn ban đầu) ===== */
    #main-shop {
      display: none;
      padding: 20px 15px 30px;
      max-width: 700px;
      margin: 0 auto;
      background: linear-gradient(145deg, #0b1020 0%, #030617 100%);
      min-height: 100vh;
      box-shadow: 0 0 50px rgba(0, 160, 255, 0.2);
    }

    /* Tiêu đề SHOP ALL */
    .shop-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
      margin: 20px 0 15px;
      color: white;
      text-shadow: 0 0 25px #ffffff, 0 0 45px #5f9eff, 0 0 75px #003cff;
      -webkit-text-stroke: 2px black;
      letter-spacing: 8px;
      transform: perspective(500px) rotateX(2deg);
    }

    /* Nút menu chính */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 25px 0 20px;
    }

    .menu-btn {
      background: rgba(20, 25, 45, 0.8);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 18px 20px;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 18px #ffffff, 0 0 35px #006eff;
      letter-spacing: 3px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 30px rgba(255,255,255,0.4);
      transform: perspective(800px) rotateX(1deg);
      transition: 0.25s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1e2440, #0b0f1c);
      border-bottom: 3px solid #ffffff80;
    }

    .menu-btn i {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 12px white);
    }

    .menu-btn:hover {
      transform: scale(1.02) translateY(-3px);
      border-color: white;
      box-shadow: 0 0 40px #ffffffcc, 0 15px 30px black;
    }

    /* Khu vực nội dung sản phẩm */
    .product-panel {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 20px 15px;
      margin: 15px 0 25px;
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 40px #3f6eff55;
    }

    .product-item {
      background: #0c1020dd;
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 20px;
      border-left: 5px solid #ffffff;
      box-shadow: 0 0 25px #ffffff66;
      backdrop-filter: blur(10px);
    }

    .product-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 20px #ffffff, 0 0 40px #4d7cff;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .price-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-weight: 700;
      font-size: 1.1rem;
      background: #1a1f33;
      padding: 8px 15px;
      border-radius: 40px;
      color: #f0f5ff;
      box-shadow: 0 0 10px black;
    }

    .feature-badge {
      background: #00c853;
      color: black;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      margin-left: 5px;
    }

    .admin-contact {
      background: #0a0e1be0;
      border-radius: 25px;
      padding: 20px;
      text-align: center;
      margin-top: 10px;
    }

    .zalo-btn, .box-btn {
      display: inline-block;
      margin: 8px;
      background: #0066ff;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 800;
      color: white;
      text-decoration: none;
      box-shadow: 0 0 25px #0080ff;
      transition: 0.2s;
    }

    .hidden {
      display: none !important;
    }

    audio {
      display: none;
    }

    .music-note {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000000aa;
      padding: 10px;
      border-radius: 50%;
      color: white;
      z-index: 999;
    }
  </style>
</head>
<body>
  <!-- NHẠC NỀN (nhạc bạn thêm - mình dùng nhạc nền tạm, bạn thay link) -->
  <audio id="bg-music" loop autoplay>
    <!-- Bạn hãy thay src bằng link nhạc mình muốn, có thể upload lên GitHub hoặc dùng link nhạc trực tiếp -->
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Trình duyệt không hỗ trợ audio.
  </audio>

  <!-- MÀN CHÀO MỪNG -->
  <div id="welcome-screen">
    <div class="welcome-text">CHÀO MỪNG ĐẾN VỚI SHOP ALL FREE FIRE<br>TRUNGSANG X SHOP👾</div>
    <div class="loader-container">
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
      </div>
      <div id="percentage-text">0%</div>
    </div>
  </div>

  <!-- SHOP CHÍNH -->
  <div id="main-shop">
    <div class="shop-title">SHOP ALL</div>

    <!-- MENU CHÍNH: DRIP MENU, PROXY ADR... -->
    <div class="menu-grid" id="menu-buttons">
      <div class="menu-btn" data-menu="drip-proxy"><i class="fas fa-bolt"></i> DRIP MENU, PROXY ADR 🚀</div>
      <div class="menu-btn" data-menu="fluorite"><i class="fas fa-gem"></i> FLUORITE 🚀</div>
      <div class="menu-btn" data-menu="migul"><i class="fas fa-rocket"></i> MIGUL LITE 🚀<br>MIGUL PRO 🚀</div>
      <div class="menu-btn" data-menu="proxyvip"><i class="fas fa-crown"></i> PROXY VIP V2 🚀(All AIM)</div>
      <div class="menu-btn" data-menu="chungchi"><i class="fas fa-certificate"></i> CHỨNG CHỈ 👑ESGIN💎</div>
      <div class="menu-btn" data-menu="admin"><i class="fas fa-user-shield"></i> THÔNG TIN ADMIN👾</div>
    </div>

    <!-- Khu vực hiển thị sản phẩm / nội dung động -->
    <div id="dynamic-content" class="product-panel">
      <p style="text-align:center; opacity:0.8;">👇 Chọn một mục ở trên để xem chi tiết</p>
    </div>
  </div>

  <script>
    (function() {
      // --- LOADING & CHÀO MỪNG ---
      const welcomeScreen = document.getElementById('welcome-screen');
      const mainShop = document.getElementById('main-shop');
      const progressFill = document.getElementById('progress-fill');
      const percentageText = document.getElementById('percentage-text');
      const bgMusic = document.getElementById('bg-music');

      // Tự động phát nhạc (nhiều trình duyệt chặn, cần tương tác; ta thử play)
      document.addEventListener('click', function() {
        if (bgMusic.paused) {
          bgMusic.play().catch(e => console.log('Nhạc cần tương tác người dùng'));
        }
      }, { once: false });

      // Hiển thị chữ chào mừng 5 giây, sau đó bắt đầu loading 0% đến 100%
      let loadStarted = false;
      setTimeout(() => {
        if (!loadStarted) {
          loadStarted = true;
          startLoading();
        }
      }, 5000); // Chữ sáng 5 giây rồi mất (thực ra chữ vẫn hiện đến khi load xong)

      function startLoading() {
        let percent = 0;
        const interval = setInterval(() => {
          percent += Math.floor(Math.random() * 5) + 1;
          if (percent >= 100) {
            percent = 100;
            clearInterval(interval);
            progressFill.style.width = '100%';
            percentageText.textContent = '100%';
            // Chuyển vào shop chính
            setTimeout(() => {
              welcomeScreen.style.opacity = '0';
              welcomeScreen.style.visibility = 'hidden';
              mainShop.style.display = 'block';
              // Cố gắng phát nhạc khi vào shop
              bgMusic.play().catch(()=>{});
            }, 400);
          }
          progressFill.style.width = percent + '%';
          percentageText.textContent = percent + '%';
        }, 70);
      }

      // Nếu người dùng click sớm để kích hoạt audio, vẫn giữ logic
      // --- XỬ LÝ MENU SẢN PHẨM ---
      const dynamicContent = document.getElementById('dynamic-content');
      const menuButtons = document.querySelectorAll('.menu-btn');

      // Dữ liệu sản phẩm theo menu
      const productData = {
        'drip-proxy': `
          <div class="product-item">
            <div class="product-name">🔥 DRIP MENU ADR 🚀</div>
            <div class="price-line"><span>180.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>350.000 VNĐ</span> <span>30 DAY🛍️</span></div>
            <div style="margin-top:10px;"><span class="feature-badge">ANTIBAN ✅</span> <span class="feature-badge">ALL ADR ✅</span></div>
          </div>
          <div class="product-item">
            <div class="product-name">🌐 PROXY ADR 🚀</div>
            <div class="price-line"><span>80.000 VNĐ</span> <span>1 DAY🛍️</span></div>
            <div class="price-line"><span>160.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>320.000 VNĐ</span> <span>30 DAY🛍️</span></div>
            <div><span class="feature-badge">ANTIBAN ✅</span> <span class="feature-badge">ALL ADR ✅</span></div>
          </div>
        `,
        'fluorite': `
          <div class="product-item">
            <div class="product-name">💎 FLUORITE 🚀</div>
            <div class="price-line"><span>120.000 VNĐ</span> <span>1 DAY🛍️</span></div>
            <div class="price-line"><span>280.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>520.000 VNĐ</span> <span>30 DAY🛍️</span></div>
            <div><span class="feature-badge">ANTIBAN ✅</span> <span class="feature-badge">TIPA ALL IOS ✅</span></div>
          </div>
        `,
        'migul': `
          <div class="product-item">
            <div class="product-name">⚡ MIGUL LITE 🚀</div>
            <div class="price-line"><span>100.000 VNĐ</span> <span>1 DAY🛍️</span></div>
            <div class="price-line"><span>300.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>700.000 VNĐ</span> <span>30 DAY🛍️</span></div>
          </div>
          <div class="product-item">
            <div class="product-name">🚀 MIGUL PRO 🚀</div>
            <div class="price-line"><span>25.000 VNĐ</span> <span>1 GIỜ🛍️</span></div>
            <div class="price-line"><span>170.000 VNĐ</span> <span>1 DAY🛍️</span></div>
            <div class="price-line"><span>310.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>715.000 VNĐ</span> <span>30 DAY🛍️</span></div>
            <div><span class="feature-badge">ANTIBAN✅</span> <span class="feature-badge">ALL IOS✅</span></div>
          </div>
        `,
        'proxyvip': `
          <div class="product-item">
            <div class="product-name">🎯 PROXY VIP V2🚀 (ALL AIM)</div>
            <div class="price-line"><span>30.000 VNĐ</span> <span>1 DAY 🛍️</span></div>
            <div class="price-line"><span>110.000 VNĐ</span> <span>7 DAY🛍️</span></div>
            <div class="price-line"><span>220.000 VNĐ</span> <span>30 DAY🛍️</span></div>
          </div>
        `,
        'chungchi': `
          <div class="product-item">
            <div class="product-name">📋 CHỨNG CHỈ ESGIN 💎</div>
            <div><span class="feature-badge">📱 Gói iPhone/iPad</span></div>
            <div class="price-line"><span>160.000 VND🛍️</span> <span>Lấy Ngay (Không BH)</span></div>
            <div class="price-line"><span>280.000 VND🛍️</span> <span>Lấy ngay - BH 40 ngày</span></div>
            <div class="price-line"><span>320.000 VND🛍️</span> <span>Lấy ngay - BH 300 ngày</span></div>
            <p style="margin-top:10px;"><strong>Toàn bộ chứng chỉ 1 năm</strong></p>
            <p>⚙️ Chức năng dài, liên hệ Admin để rõ.</p>
          </div>
        `,
        'admin': `
          <div class="admin-contact">
            <h3 style="color:white; text-shadow:0 0 20px white;">👾 THÔNG TIN ADMIN</h3>
            <p><strong>ZALO ADMIN:</strong> 0372822927</p>
            <a href="https://zalo.me/0372822927" target="_blank" class="zalo-btn"><i class="fas fa-phone"></i> ZALO ADMIN</a>
            <a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank" class="box-btn"><i class="fas fa-comments"></i> BOX ZALO</a>
            <p style="margin-top:20px;">🛍️ Vui lòng liên hệ ADMIN để mua những gì bạn thích</p>
          </div>
        `
      };

      menuButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const menuKey = this.getAttribute('data-menu');
          if (productData[menuKey]) {
            dynamicContent.innerHTML = productData[menuKey];
            // Thêm hiệu ứng nhẹ
            dynamicContent.style.transition = '0.3s';
            dynamicContent.style.transform = 'scale(1.01)';
            setTimeout(() => { dynamicContent.style.transform = 'scale(1)'; }, 150);
          }
        });
      });

      // Mặc định hiển thị menu DRIP MENU, PROXY ADR khi vào shop (tùy chọn)
      setTimeout(() => {
        if (mainShop.style.display === 'block') {
          const defaultBtn = document.querySelector('.menu-btn[data-menu="drip-proxy"]');
          if (defaultBtn) defaultBtn.click();
        }
      }, 600);
    })();
  </script>
</body>
</html>
