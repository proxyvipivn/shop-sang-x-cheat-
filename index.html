<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>SHOP ALL FREE FIRE | TRUNGSANG X CHEAT 🚀💹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: #0a0f14;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #page1 {
      display: block;
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0b1a2f, #020810);
      position: relative;
    }
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #030711;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .glow-text {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: #b3f0ff;
      text-shadow: 0 0 15px #5ec8f2, 0 0 40px #2aa9c9;
      text-align: center;
      animation: gentlePulse 2s infinite;
      margin-bottom: 30px;
    }
    @keyframes gentlePulse {
      0% { text-shadow: 0 0 10px #5ec8f2, 0 0 30px #2aa9c9; }
      50% { text-shadow: 0 0 25px #8ef0ff, 0 0 55px #3cc6e0; }
      100% { text-shadow: 0 0 10px #5ec8f2, 0 0 30px #2aa9c9; }
    }
    .progress-wrapper {
      width: 280px;
      max-width: 70vw;
      height: 20px;
      background: #1e2a3a;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 25px #2aa9c9;
      margin: 20px 0;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7fd6f5, #3aa8c9);
      box-shadow: 0 0 20px #6cd0f0;
      border-radius: 30px;
      transition: width 0.1s ease;
    }
    .percent-text {
      color: #c2f0ff;
      font-weight: bold;
      font-size: 1.8rem;
      text-shadow: 0 0 15px #3aa8c9;
      margin-top: 10px;
    }
    .status-message {
      color: #a0d9ff;
      margin-top: 8px;
      font-style: italic;
      font-weight: 500;
    }
    #main-shop {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    #main-shop.active {
      display: flex;
    }
    .shop-header {
      padding: 25px 15px 10px;
      text-align: center;
      color: #b3f0ff;
      text-shadow: 0 0 18px #2aa9c9;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      border-bottom: 2px solid rgba(90, 200, 240, 0.3);
    }
    .tab-content-area {
      flex: 1;
      padding: 20px 18px;
      color: #d4f0ff;
      background: rgba(8, 20, 30, 0.8);
      backdrop-filter: blur(10px);
      margin: 15px;
      border-radius: 28px;
      border: 1px solid rgba(80, 200, 250, 0.35);
      box-shadow: 0 0 35px rgba(0, 180, 230, 0.25);
      transition: 0.3s;
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .footer-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #0a1722;
      display: flex;
      overflow-x: auto;
      border-top: 2px solid #2aa9c9;
      box-shadow: 0 -5px 25px rgba(0, 170, 220, 0.5);
      z-index: 100;
    }
    .footer-nav button {
      flex: 1 0 auto;
      background: transparent;
      border: none;
      color: #b3eaff;
      font-weight: bold;
      padding: 16px 12px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: 0 0 10px #2aa9c9;
      border-right: 1px solid #2a4955;
    }
    .footer-nav button:hover,
    .footer-nav button.active-tab {
      background: #102b3a;
      color: #ffffff;
      text-shadow: 0 0 20px #7de0ff;
      box-shadow: inset 0 -4px 0 #5ec8f2;
    }
    #page2 {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #1a0f1f;
      position: relative;
    }
    #page2.active {
      display: block;
    }
    .page2-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #140c1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9998;
      transition: opacity 0.5s;
    }
    .page2-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .blink-dot {
      width: 22px;
      height: 22px;
      background: #d9b3ff;
      border-radius: 50%;
      margin: 0 10px;
      display: inline-block;
      box-shadow: 0 0 30px #c084fc;
      animation: blinkAnim 0.5s infinite alternate;
    }
    @keyframes blinkAnim {
      from { opacity: 0.2; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1.4); box-shadow: 0 0 50px #d59cff; }
    }
    .page2-main {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 30%, #301c3a, #12061a);
      color: #eeddff;
      padding-bottom: 30px;
    }
    .page2-main.active {
      display: flex;
    }
    .exit-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #3d1e4a;
      border: none;
      color: #f5e5ff;
      font-size: 1.4rem;
      width: 45px;
      height: 45px;
      border-radius: 30px;
      box-shadow: 0 0 18px #bc7af5;
      cursor: pointer;
      z-index: 10;
    }
    .vip-header {
      text-align: center;
      padding: 30px 15px 10px;
      font-size: 1.8rem;
      font-weight: bold;
      text-shadow: 0 0 25px #c58aff;
    }
    .vip-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .vip-tab-btn {
      background: #261831;
      border: 1px solid #b77af0;
      color: #ecd9ff;
      padding: 12px 18px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 12px #aa6fdd;
    }
    .vip-tab-btn.active {
      background: #7734b0;
      color: white;
    }
    .voucher-input-area {
      margin: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .voucher-input-area input {
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: #2c1d38;
      color: #f0e2ff;
      font-weight: bold;
      box-shadow: 0 0 15px #aa6fdd;
    }
    .voucher-input-area button {
      background: #b162e6;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 25px #c175ff;
    }
    .info-box {
      background: #241831;
      margin: 20px;
      padding: 20px;
      border-radius: 24px;
      border: 1px solid #bc7af5;
    }
  </style>
</head>
<body>
  <div id="page1">
    <div class="loading-screen" id="loadingScreen">
      <div class="glow-text">SHOP ALL FREE FIRE<br>TRUNGSANG X CHEAT🚀💹</div>
      <div class="progress-wrapper"><div class="progress-fill" id="progressFill"></div></div>
      <div class="percent-text" id="percentDisplay">0%</div>
      <div class="status-message" id="statusMessage">Đang chuẩn bị shop...</div>
    </div>
    <div id="main-shop">
      <div class="shop-header">✨ SHOP ALL FREE FIRE ✨</div>
      <div class="tab-content-area" id="tabContent">Chọn một mục bên dưới để xem chi tiết.</div>
    </div>
    <div class="footer-nav" id="footerNav" style="display: none;">
      <button data-tab="shopall">🏪 SHOP ALL</button>
      <button data-tab="price">💰 GIÁ/ALL SP</button>
      <button data-tab="features">⚙️ CHỨC NĂNG</button>
      <button data-tab="admin">👑 ADMIN</button>
    </div>
  </div>

  <div id="page2">
    <div class="page2-loading" id="page2Loading">
      <div>
        <span class="blink-dot"></span><span class="blink-dot"></span><span class="blink-dot"></span>
      </div>
      <div style="color:#d9b3ff; margin-top:20px; font-weight:bold;">Đang kết nối HACH FF SHOP...</div>
    </div>
    <div class="page2-main" id="page2Main">
      <button class="exit-button" id="exitPage2">✕</button>
      <div class="vip-header">👑 NHẬN ALL HACH FF SHOP VÀ VIP 👑</div>
      <div style="text-align:center; color:#cda5f0;">Nick của bạn: <span id="userNickDisplay">---</span></div>
      <div class="vip-tabs">
        <button class="vip-tab-btn active" data-vtab="napvip">💳 NẠP VIP</button>
        <button class="vip-tab-btn" data-vtab="muavoucher">🛍️ MUA VOUCHER</button>
        <button class="vip-tab-btn" data-vtab="nhapvoucher">🎫 NHẬP VOUCHER</button>
      </div>
      <div id="vipTabContent" class="info-box">Chọn tab để xem.</div>
    </div>
  </div>

  <script>
    (function() {
      const products = [
        { id: 1, name: 'SX2 PROXY ADR🚀💠', prices: [{ label: '1 DAY', value: 20000 }, { label: '7 DAY', value: 50000 }, { label: '14 DAY', value: 100000 }, { label: '30 DAY', value: 180000 }] },
        { id: 2, name: 'MIGUL BASIC VN🚀💠', prices: [{ label: '1 DAY', value: 65000 }, { label: '7 DAY', value: 145000 }, { label: '30 DAY', value: 300000 }] },
        { id: 3, name: 'MIGUL PRO VN🚀💠', prices: [{ label: '1 GIỜ', value: 20000 }, { label: '1 DAY', value: 130000 }, { label: '7 DAY', value: 250000 }, { label: '30 DAY', value: 536000 }] },
        { id: 4, name: 'PROXY VIP V2💠 (ALL AIM)', prices: [{ label: '1 DAY', value: 24000 }, { label: '7 DAY', value: 54000 }, { label: '30 DAY', value: 115000 }, { label: 'VĨNH VIỄN', value: 300000 }] },
        { id: 5, name: 'Fix lag ios📲', prices: [{ label: 'Vĩnh viễn', value: 90000 }] },
        { id: 6, name: 'Acc FF 🔱', prices: [{ label: '1 ACC', value: 13000 }, { label: 'ACC RANK KC TC', value: 80000 }] },
        { id: 7, name: 'ESGIN 💎', prices: [{ label: 'Gói iPhone/iPad (không BH)', value: 140000 }, { label: 'Gói BH 40 ngày', value: 300000 }, { label: 'Gói BH 300 ngày', value: 600000 }] }
      ];

      function generateVoucherSet(prefix, count = 50) {
        const set = new Set();
        while (set.size < count) {
          const rand = Math.random().toString(36).substring(2, 8).toUpperCase();
          set.add(`${prefix}-${rand}`);
        }
        return Array.from(set);
      }

      const voucherPool = {
        'G1': generateVoucherSet('G1', 50),
        'G2': generateVoucherSet('G2', 50),
        'G3': generateVoucherSet('G3', 50),
        'G4': generateVoucherSet('G4', 50),
        'G5': generateVoucherSet('G5', 50)
      };

      console.log('===== DANH SÁCH VOUCHER =====');
      console.log('GÓI 1 (9% - 3 ngày):', voucherPool['G1']);
      console.log('GÓI 2 (18% - 8 ngày):', voucherPool['G2']);
      console.log('GÓI 3 (25% - 14 ngày):', voucherPool['G3']);
      console.log('GÓI 4 (36% - 23 ngày):', voucherPool['G4']);
      console.log('GÓI 5 (50% - VĨNH VIỄN):', voucherPool['G5']);

      const STORAGE_KEY = 'ff_shop_userdata';
      let appState = {
        userNick: null,
        activeVoucher: null,
        usedVouchers: []
      };

      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            appState = { ...appState, ...parsed };
            if (appState.activeVoucher && appState.activeVoucher.package !== 'G5' && Date.now() > appState.activeVoucher.expiresAt) {
              appState.activeVoucher = null;
            }
          } catch (e) {}
        }
        if (!appState.userNick) {
          appState.userNick = 'User_' + Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        saveState();
        document.getElementById('userNickDisplay').textContent = appState.userNick;
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      }

      function getDiscountedPrice(originalPrice, productId) {
        if (!appState.activeVoucher) return originalPrice;
        const v = appState.activeVoucher;
        if (v.package !== 'G5' && Date.now() > v.expiresAt) {
          appState.activeVoucher = null;
          saveState();
          return originalPrice;
        }
        if ([5,6,7].includes(productId)) return originalPrice;
        return Math.floor(originalPrice * (1 - v.discountPercent / 100));
      }

      function formatCurrency(num) {
        return num.toLocaleString('vi-VN') + ' VNĐ';
      }

      const loadingScreen = document.getElementById('loadingScreen');
      const progressFill = document.getElementById('progressFill');
      const percentDisplay = document.getElementById('percentDisplay');
      const statusMsg = document.getElementById('statusMessage');
      const mainShop = document.getElementById('main-shop');
      const footerNav = document.getElementById('footerNav');
      const tabContent = document.getElementById('tabContent');

      let loadPercent = 0;
      const statuses = ['Đang chuẩn bị shop...', 'Sắp hoàn thành...', 'Thành công!'];
      function updateLoading() {
        if (loadPercent < 100) {
          loadPercent += Math.floor(Math.random() * 4) + 1;
          if (loadPercent > 100) loadPercent = 100;
          progressFill.style.width = loadPercent + '%';
          percentDisplay.textContent = loadPercent + '%';
          if (loadPercent < 40) statusMsg.textContent = statuses[0];
          else if (loadPercent < 85) statusMsg.textContent = statuses[1];
          else statusMsg.textContent = statuses[2];
          if (loadPercent < 100) {
            setTimeout(updateLoading, 40 + Math.random() * 60);
          } else {
            setTimeout(() => {
              loadingScreen.classList.add('hidden');
              mainShop.classList.add('active');
              footerNav.style.display = 'flex';
              document.getElementById('tabContent').innerHTML = '✅ Shop đã sẵn sàng! Chọn mục bên dưới.';
            }, 400);
          }
        }
      }

      window.addEventListener('load', () => {
        loadState();
        updateLoading();
      });

      const tabButtons = document.querySelectorAll('#footerNav button');
      tabButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          tabButtons.forEach(b => b.classList.remove('active-tab'));
          this.classList.add('active-tab');
          loadTabContent(this.dataset.tab);
        });
      });

      function loadTabContent(tab) {
        tabContent.innerHTML = '⏳ Đang tải...';
        tabContent.style.opacity = '0.6';
        setTimeout(() => {
          tabContent.style.opacity = '1';
          switch (tab) {
            case 'shopall':
              tabContent.innerHTML = `<div style="font-size:1.3rem;">🚀 SHOP ALL</div>
                <div>• SX2 PROXY ADR🚀💠</div><div>• MIGUL BASIC VN🚀💠</div>
                <div>• MIGUL PRO VN🚀💠</div><div>• PROXY VIP V2 🚀💠(All IOS)</div>
                <div>• CHỨNG CHỈ 👑ESGIN💎</div><div>• 1 ACC👤</div><div>• ACC RANK KC TC👤</div><div>• Fix lag ios📲</div>`;
              break;
            case 'price':
              let priceHtml = '<div style="font-size:1.3rem;">💰 BẢNG GIÁ</div>';
              products.forEach(p => {
                priceHtml += `<div style="margin-top:16px; font-weight:bold; color:#a0f0ff;">${p.name}</div>`;
                p.prices.forEach(pr => {
                  const discounted = getDiscountedPrice(pr.value, p.id);
                  const showOriginal = discounted !== pr.value;
                  priceHtml += `<div>• ${pr.label}: ${formatCurrency(discounted)} ${showOriginal ? '<span style="text-decoration:line-through;color:#7a8a9a;">('+formatCurrency(pr.value)+')</span>' : ''} 🛍️</div>`;
                });
                if (p.id === 3) priceHtml += '<div>= ANTIBAN✅ = ALL IOS✅</div>';
                if (p.id === 7) priceHtml += '<div>= Toàn bộ đều chứng chỉ 1 năm</div>';
              });
              tabContent.innerHTML = priceHtml;
              break;
            case 'features':
              tabContent.innerHTML = `<div style="font-weight:bold;">⚙️ CHI TIẾT CHỨC NĂNG</div>
                <div>1️⃣ SX2 PROXY ADR: Chạy nhanh, bắn định phun đỏ⚜️</div>
                <div>2️⃣ MIGUL BASIC VN: Menu bật tắt, bắn đỏ+vàng⚜️</div>
                <div>3️⃣ MIGUL PRO VN: Antiban tuyệt đối✅</div>
                <div>4️⃣ PROXY VIP V2: AIM DRAG/BODY/NECK/MAGIC🚀</div>
                <div>5️⃣ Fix lag IOS: antiban 100%📲</div>
                <div>6️⃣ ACC FF: clone lv5-8, rank KC TC👤</div>`;
              break;
            case 'admin':
              tabContent.innerHTML = `<div>👑 THÔNG TIN ADMIN</div>
                <div>ZALO: <b>0372822927</b></div>
                <div>BOX: <a href="https://zalo.me/g/myvfgfidweld9ovmd7t4" target="_blank" style="color:#7de0ff;">zalo.me/g/myvfgfidweld9ovmd7t4</a></div>
                <div>NGÂN HÀNG: MB BANK - STK: 0372822927 - TRAN TRUNG SANG</div>
                <div>Nội dung CK: AIM GÌ VÀ MUA BẢNG AIM ĐÓ</div>`;
              break;
          }
        }, 1000 + Math.random() * 1500);
      }

      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const page2Loading = document.getElementById('page2Loading');
      const page2Main = document.getElementById('page2Main');

      function showPage2() {
        page1.style.display = 'none';
        page2.classList.add('active');
        page2Loading.classList.remove('hidden');
        page2Main.classList.remove('active');
        let blinks = 0;
        const maxBlinks = 5 + Math.floor(Math.random() * 6);
        const blinkInterval = setInterval(() => {
          blinks++;
          if (blinks >= maxBlinks) {
            clearInterval(blinkInterval);
            page2Loading.classList.add('hidden');
            page2Main.classList.add('active');
            document.getElementById('userNickDisplay').textContent = appState.userNick;
            loadVipTab('napvip');
          }
        }, 600);
      }

      document.getElementById('exitPage2').addEventListener('click', () => {
        page2.classList.remove('active');
        page2Main.classList.remove('active');
        page1.style.display = 'block';
        mainShop.classList.add('active');
        footerNav.style.display = 'flex';
      });

      const floatBtn = document.createElement('button');
      floatBtn.textContent = '🎁 NHẬN HACH VIP';
      floatBtn.style.cssText = 'position:fixed;bottom:100px;right:20px;z-index:200;background:#c084fc;border:none;padding:14px 20px;border-radius:40px;font-weight:bold;color:white;box-shadow:0 0 30px #bc7af5;cursor:pointer;';
      floatBtn.addEventListener('click', showPage2);
      document.body.appendChild(floatBtn);

      const vipTabBtns = document.querySelectorAll('.vip-tab-btn');
      const vipTabContent = document.getElementById('vipTabContent');
      vipTabBtns.forEach(b => {
        b.addEventListener('click', function() {
          vipTabBtns.forEach(x => x.classList.remove('active'));
          this.classList.add('active');
          loadVipTab(this.dataset.vtab);
        });
      });

      function loadVipTab(tab) {
        switch (tab) {
          case 'napvip':
            vipTabContent.innerHTML = `<div>👑 NẠP VIP</div>
              <div>Gói 1 (40k / 3 ngày) - giảm 9%</div>
              <div>Gói 2 (90k / 8 ngày) - giảm 18%</div>
              <div>Gói 3 (150k / 14 ngày) - giảm 25%</div>
              <div>Gói 4 (250k / 23 ngày) - giảm 36%</div>
              <div>Gói 5 SIÊU VIP+ (800k / Vĩnh viễn) - giảm 50%</div>
              <div style="margin-top:15px;">Liên hệ ZALO: 0372822927 để mua.</div>`;
            break;
          case 'muavoucher':
            vipTabContent.innerHTML = `<div>🛍️ MUA VOUCHER</div>
              <div>Chuyển khoản MB BANK: 0372822927 - TRAN TRUNG SANG</div>
              <div>Nội dung: Gói vip + tên người mua</div>
              <div>Sau đó liên hệ ZALO admin để nhận voucher.</div>`;
            break;
          case 'nhapvoucher':
            vipTabContent.innerHTML = `<div>🎫 NHẬP VOUCHER</div>
              <div class="voucher-input-area">
                <input type="text" id="voucherCodeInput" placeholder="Nhập mã voucher...">
                <button id="applyVoucherBtn">ÁP DỤNG</button>
              </div>
              <div id="voucherMessage" style="margin-top:15px;"></div>`;
            document.getElementById('applyVoucherBtn').addEventListener('click', applyVoucher);
            break;
        }
      }

      function applyVoucher() {
        const code = document.getElementById('voucherCodeInput')?.value.trim().toUpperCase();
        const msgDiv = document.getElementById('voucherMessage');
        if (!code) { msgDiv.innerHTML = '❌ Vui lòng nhập mã.'; return; }
        if (appState.usedVouchers.includes(code)) { msgDiv.innerHTML = '⚠️ Voucher này đã được sử dụng.'; return; }

        let foundPackage = null;
        let discountPercent = 0;
        for (let [pkg, codes] of Object.entries(voucherPool)) {
          if (codes.includes(code)) {
            foundPackage = pkg;
            if (pkg === 'G1') discountPercent = 9;
            else if (pkg === 'G2') discountPercent = 18;
            else if (pkg === 'G3') discountPercent = 25;
            else if (pkg === 'G4') discountPercent = 36;
            else if (pkg === 'G5') discountPercent = 50;
            break;
          }
        }
        if (!foundPackage) { msgDiv.innerHTML = '❌ Mã voucher không tồn tại.'; return; }

        let days = 0;
        if (foundPackage === 'G1') days = 3;
        else if (foundPackage === 'G2') days = 8;
        else if (foundPackage === 'G3') days = 14;
        else if (foundPackage === 'G4') days = 23;
        const now = Date.now();
        const expiresAt = foundPackage === 'G5' ? Infinity : now + days * 24 * 60 * 60 * 1000;
        appState.activeVoucher = { code, package: foundPackage, discountPercent, activatedAt: now, expiresAt };
        appState.usedVouchers.push(code);
        saveState();
        msgDiv.innerHTML = `✅ Voucher ${code} áp dụng! Giảm ${discountPercent}% ${foundPackage === 'G5' ? '(VĨNH VIỄN)' : 'đến ' + new Date(expiresAt).toLocaleDateString('vi-VN')}.`;
        if (document.querySelector('#footerNav button.active-tab')?.dataset.tab === 'price') loadTabContent('price');
      }

      setInterval(() => {
        if (appState.activeVoucher && appState.activeVoucher.package !== 'G5' && Date.now() > appState.activeVoucher.expiresAt) {
          appState.activeVoucher = null;
          saveState();
        }
      }, 60000);

      document.querySelector('#footerNav button[data-tab="shopall"]')?.click();
    })();
  </script>
</body>
</html>
