    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng hạt tuyết */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* Màn hình chào mừng */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            transition: opacity 0.5s;
        }

        .welcome-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-text {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcf7f, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            }
        }

        /* Thanh loading */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .loading-screen.active {
            display: flex;
        }

        .loading-bar {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f);
            border-radius: 10px;
            transition: width 0.1s;
            width: 0%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .loading-text {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #ffd93d;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Main content */
        .main-content {
            display: none;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .main-content.active {
            display: block;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        /* Navigation tabs */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-tab {
            padding: 15px 30px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 215, 61, 0.2));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .nav-tab:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            border-color: #ff6b6b;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            border-color: #ffd93d;
            box-shadow: 0 0 30px rgba(255, 215, 61, 0.5);

            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 400px;
            animation: fadeIn 0.5s ease-out;

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;

            margin: 8px 0;
            border-left: 3px solid #ff6b6b;
            transition: all 0.3s ease;
        }

            background: rgba(255, 107, 107, 0.2);
            transform: translateX(10px);
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 5px;

            margin: 20px 0;

            text-decoration: none;
            border-radius: 50px;

        /* Loading animation for content */

            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            z-index: -1;

        @media (max-width: 768px) {

                font-size: 2rem;
            }

                padding: 10px 20px;
                font-size: 0.9rem;

        }
    </style>

        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const flakes = ['❄', '❅', '❆', '✦', '✧', '⋆'];
            
            for (let i = 0; i < 50; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = flakes[Math.floor(Math.random() * flakes.length)];
                flake.style.left = Math.random() * 100 + '%';
                flake.style.animationDuration = Math.random() * 3 + 2 + 's';
                flake.style.animationDelay = Math.random() * 5 + 's';
                flake.style.fontSize = Math.random() * 20 + 10 + 'px';
                flake.style.opacity = Math.random() * 0.8 + 0.2;
                container.appendChild(flake);
            }
        }

        // Welcome screen
        setTimeout(() => {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.add('active');
            startLoading();

        // Loading animation

            let progress = 0;
            const progressBar = document.getElementById('loadingProgress');
            const loadingText = document.getElementById('loadingText');
            
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                loadingText.textContent = getLoadingText(progress) + ' ' + Math.floor(progress) + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loadingScreen').classList.remove('active');
                        document.getElementById('mainContent').classList.add('active');
                        showContent('shop-all', document.querySelector('.nav-tab'));
                    }, 500);
                }
            }, 100);

        function getLoadingText(progress) {
            if (progress < 25) return 'Đang tải...';
            if (progress < 50) return 'Chuẩn bị...';
            if (progress < 75) return 'Sắp hoàn thành...';
            if (progress < 95) return 'Hoàn thành...';
            return 'Hoàn thành!';
