l<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nhân vật chạy 4 hướng</title>
<style>
  body { margin:0; background:#1a1a1a; display:flex; justify-content:center;
         align-items:center; height:100vh; font-family:sans-serif; }
  canvas { border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ============ NHÂN VẬT ============ */
const player = {
  x: 0, y: 0,           // vị trí trong thế giới
  speed: 220,
  dir: 'down',          // down | up | left | right
  moving: false,
  animTime: 0
};

/* ============ CAMERA ============ */
const cam = { x: 0, y: 0 };

/* ============ CÂY CỐI (rải ngẫu nhiên) ============ */
const trees = [];
for (let i = 0; i < 60; i++) {
  trees.push({
    x: (Math.random() - 0.5) * 2400,
    y: (Math.random() - 0.5) * 2400
  });
}

const ROAD = 150;   // kích thước ô lưới đường

/* ============ INPUT ============ */
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

/* ============ UPDATE ============ */
function update(dt) {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  player.moving = (dx !== 0 || dy !== 0);

  if (player.moving) {
    // Hướng mặt: ưu tiên trục có độ lệch lớn hơn
    if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
    else                             player.dir = dy > 0 ? 'down'  : 'up';

    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * dt;
    player.y += (dy / len) * player.speed * dt;
    player.animTime += dt;
  } else {
    player.animTime = 0;   // đứng yên thì reset animation
  }

  // Camera bám theo nhân vật
  cam.x = player.x - W / 2;
  cam.y = player.y - H / 2;
}

/* ============ VẼ NHÂN VẬT ============ */
function drawCharacter(x, y, dir, animTime, moving) {
  const t     = animTime * 12;                // tốc độ animation
  const swing = moving ? Math.sin(t) : 0;     // tay chân vung
  const bob   = moving ? Math.abs(Math.sin(t)) * 2 : 0; // nhấp nhô

  const sideView   = (dir === 'left' || dir === 'right');
  const facingAway = (dir === 'up');
  const faceSign   = (dir === 'right') ? 1 : (dir === 'left') ? -1 : 0;

  ctx.save();
  ctx.translate(x, y - bob);

  // Bóng đổ
  ctx.beginPath();
  ctx.ellipse(0, 22, 14, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fill();

  const skin = '#f2c29b', shirt = '#3a7bd5', pants = '#2c2c34';

  // ---- CHÂN ----
  ctx.strokeStyle = pants; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const legSwing = swing * 6;
  // chân trái
  ctx.beginPath();
  ctx.moveTo(-4, 8);
  if (sideView) ctx.lineTo(-4 - legSwing, 22);
  else          ctx.lineTo(-4, 22 + legSwing * 0.4);
  ctx.stroke();
  // chân phải
  ctx.beginPath();
  ctx.moveTo(4, 8);
  if (sideView) ctx.lineTo(4 + legSwing, 22);
  else          ctx.lineTo(4, 22 - legSwing * 0.4);
  ctx.stroke();

  // ---- THÂN ----
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.roundRect(-9, -8, 18, 22, 6);
  ctx.fill();

  // ---- TAY ----
  ctx.strokeStyle = shirt; ctx.lineWidth = 5;
  const armSwing = sideView ? swing * 7 : swing * 3;
  // tay trái
  ctx.beginPath();
  ctx.moveTo(-9, -4);
  ctx.lineTo(-13, 6 + (sideView ? -armSwing :  armSwing));
  ctx.stroke();
  // tay phải
  ctx.beginPath();
  ctx.moveTo(9, -4);
  ctx.lineTo(13, 6 + (sideView ?  armSwing : -armSwing));
  ctx.stroke();

  // ---- ĐẦU ----
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -17, 9, 0, Math.PI * 2); ctx.fill();

  // Tóc
  ctx.fillStyle = '#5a3825';
  ctx.beginPath(); ctx.arc(0, -19, 9, Math.PI, 0); ctx.fill();

  // ---- MẶT ----
  if (!facingAway) {
    if (sideView) {
      const ex = faceSign * 4;
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(ex, -17, 1.6, 0, Math.PI * 2); ctx.fill();
      // miệng
      ctx.strokeStyle = '#a0452a'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(ex + faceSign * 2, -12, 2.2, 0.2, Math.PI - 0.2);
      ctx.stroke();
    } else {
      // 2 mắt
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-3, -17, 1.6, 0, Math.PI * 2);
      ctx.arc( 3, -17, 1.6, 0, Math.PI * 2);
      ctx.fill();
      // miệng
      ctx.strokeStyle = '#a0452a'; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(0, -13, 3, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* ============ VẼ CÂY ============ */
function drawTree(x, y) {
  // bóng
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x, y + 12, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
  // thân
  ctx.fillStyle = '#7a4b25';
  ctx.fillRect(x - 4, y - 12, 8, 24);
  // lá
  ctx.fillStyle = '#2e8b3e';
  ctx.beginPath(); ctx.arc(x, y - 28, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3fa952';
  ctx.beginPath(); ctx.arc(x - 7, y - 34, 13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 8, y - 26, 11, 0, Math.PI * 2); ctx.fill();
}

/* ============ RENDER ============ */
function render() {
  // Nền cỏ
  ctx.fillStyle = '#7ec850';
  ctx.fillRect(0, 0, W, H);

  // Lưới đường (cuộn theo camera)
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = 3;
  const offX = ((-cam.x % ROAD) + ROAD) % ROAD;
  const offY = ((-cam.y % ROAD) + ROAD) % ROAD;

  for (let x = offX; x < W; x += ROAD) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = offY; y < H; y += ROAD) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Gộp cây + nhân vật, sort theo Y để che khuất đúng
  const items = [];
  for (const tr of trees) items.push({ k:'tree', x:tr.x, y:tr.y });
  items.push({ k:'player', x:player.x, y:player.y });
  items.sort((a,b) => a.y - b.y);

  for (const it of items) {
    const sx = it.x - cam.x;
    const sy = it.y - cam.y;
    if (sx < -120 || sx > W + 120 || sy < -180 || sy > H + 120) continue;

    if (it.k === 'tree') drawTree(sx, sy);
    else drawCharacter(sx, sy, player.dir, player.animTime, player.moving);
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(10, 10, 210, 34);
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText('WASD / phím mũi tên để chạy', 20, 33);
}

/* ============ GAME LOOP ============ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
