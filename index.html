<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SHOP ALL FREE FIRE | TRUNGSANG X CHEAT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a1128;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #b3e5ff;
    }

    /* Viền ngoài phát sáng xanh nhạt */
    .glow-border {
      width: 100%;
      max-width: 700px;
      background: #0b1a2f;
      border-radius: 2.5rem;
      padding: 3px;
      box-shadow: 0 0 35px rgba(100, 200, 255, 0.5), 0 0 80px rgba(70, 180, 255, 0.3);
      background: linear-gradient(145deg, rgba(0, 180, 255, 0.6), rgba(0, 80, 160, 0.7), rgba(0, 200, 255, 0.5));
      animation: borderGlowPulse 3s infinite alternate ease-in-out;
    }

    @keyframes borderGlowPulse {
      0% {
        box-shadow: 0 0 25px rgba(80, 200, 255, 0.5), 0 0 60px rgba(50, 150, 255, 0.4);
        filter: brightness(1);
      }
      100% {
        box-shadow: 0 0 50px rgba(120, 220, 255, 0.8), 0 0 100px rgba(70, 180, 255, 0.7);
        filter: brightness(1.1);
      }
    }

    .main-container {
      background: #071126;
      border-radius: 2.4rem;
      padding: 20px 18px 30px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 40px rgba(0, 160, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid rgba(0, 210, 255, 0.25);
    }

    /* Loading screen */
    #loadingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 10px;
      transition: all 0.4s ease;
    }

    .shop-title-glow {
      font-size: clamp(2rem, 10vw, 3.2rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
      color: #9ce6ff;
      text-shadow: 0 0 20px #00b4ff, 0 0 50px #0077ff, 0 0 10px #7fd6ff;
      letter-spacing: 2px;
      animation: textGlowSoft 2s infinite alternate;
    }

    @keyframes textGlowSoft {
      0% {
        text-shadow: 0 0 15px #7fd6ff, 0 0 40px #0099ff, 0 0 60px #0055cc;
      }
      100% {
        text-shadow: 0 0 30px #b3f0ff, 0 0 65px #3399ff, 0 0 85px #0066ff;
      }
    }

    .progress-container {
      width: 100%;
      background: #0a1630;
      height: 20px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 0 20px #0088ff;
      border: 1px solid #25aaff;
      margin: 10px 0 5px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9be0ff, #3aa5ff, #00c8ff);
      box-shadow: 0 0 25px #00a6ff, 0 0 10px #c2edff;
      border-radius: 40px;
      transition: width 0.05s linear;
    }

    #loadingText {
      font-size: 1.3rem;
      font-weight: 600;
      color: #b6eeff;
      text-shadow: 0 0 12px #0099ff;
      min-height: 32px;
      text-align: center;
    }

    #percentDisplay {
      font-weight: 700;
      font-size: 1.8rem;
      color: #ccf0ff;
      margin-left: 6px;
    }

    /* Nội dung chính sau load */
    #mainShopContent {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .shop-header {
      text-align: center;
      color: #c6eeff;
      text-shadow: 0 0 18px #0088ff;
      font-weight: 700;
      font-size: 2rem;
      border-bottom: 2px dashed #3ea6ff;
      padding-bottom: 10px;
    }

    .dynamic-panel {
      background: rgba(8, 24, 50, 0.75);
      border-radius: 2rem;
      padding: 18px 12px;
      backdrop-filter: blur(16px);
      border: 1px solid #2f8fff;
      box-shadow: 0 0 25px rgba(0, 180, 255, 0.5);
      min-height: 220px;
      transition: 0.25s;
      color: #ddf0ff;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }

    .tab-btn {
      background: #0b1e3c;
      border: 1px solid #2f80ed;
      color: #b3e2ff;
      padding: 12px 18px;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 0 12px rgba(0, 160, 255, 0.4);
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-btn:hover {
      background: #1a3f6e;
      box-shadow: 0 0 25px #0099ff;
      border-color: #7fc9ff;
      color: white;
      transform: scale(1.02);
    }

    .tab-btn.active {
      background: #0055aa;
      border-color: #b3e5ff;
      box-shadow: 0 0 35px #3aa5ff;
      color: white;
      font-weight: 700;
    }

    .price-highlight {
      color: #ffd966;
      font-weight: 700;
      text-shadow: 0 0 8px #ffb700;
    }

    a {
      color: #8dcaff;
      text-decoration: none;
      border-bottom: 1px dashed #4dabff;
    }

    hr {
      border: 0.5px solid #1e4b7a;
      margin: 10px 0;
    }
  </style>
</head>

    // LOADING TIẾN TRÌNH

    const progressFill = document.getElementById('progressFill');
    const percentDisplay = document.getElementById('percentDisplay');
    const loadingText = document.getElementById('loadingText');

    let percent = 0;
    const duration = 3500; // tổng thời gian load khoảng 3.5s
    const intervalTime = 35;
    const increment = 100 / (duration / intervalTime);

    function updateLoadingText(percentVal) {
      const p = Math.floor(percentVal);
      if (p < 45) {
        loadingText.innerHTML = `Đang chuẩn bị shop <span id="percentDisplay">${p}%</span>`;
      } else if (p < 85) {
        loadingText.innerHTML = `Sắp hoàn thành <span id="percentDisplay">${p}%</span>`;
      } else if (p < 100) {
        loadingText.innerHTML = `Hoàn thành <span id="percentDisplay">${p}%</span>`;
      } else {
        loadingText.innerHTML = `✅ Hoàn Thành Công <span id="percentDisplay">100%</span>`;
      }
    }

    const loadingInterval = setInterval(() => {
      percent += increment;
      if (percent >= 100) {
        percent = 100;
        progressFill.style.width = '100%';
        updateLoadingText(100);
        clearInterval(loadingInterval);
        // Hiệu ứng chữ biến mất dần rồi hiện nội dung
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.5s';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            mainContent.style.display = 'flex';
          }, 400);
        }, 700);
      } else {
        progressFill.style.width = percent + '%';
        updateLoadingText(percent);
      }
    }, intervalTime);

    const dynamicDiv = document.getElementById('dynamicContent');

    function switchTab(tabKey, button) {

      dynamicDiv.style.opacity = '0.5';
      dynamicDiv.style.transition = 'opacity 0.2s';
      setTimeout(() => {
        dynamicDiv.innerHTML = contentData[tabKey] || 'Đang cập nhật...';
        dynamicDiv.style.opacity = '1';
      }, 900); // khoảng 0.9s, gần 1-3s cảm giác mượt

      tabButtons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    // Mặc định hiển thị tab SHOP ALL
    if (dynamicDiv) {
      dynamicDiv.innerHTML = contentData.shopall;
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const tab = this.dataset.tab;
        if (tab) {
          switchTab(tab, this);
        }
      });
    });

    // Đảm bảo trạng thái active ban đầu
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab && dynamicDiv) {
      const defaultTab = activeTab.dataset.tab || 'shopall';
      dynamicDiv.innerHTML = contentData[defaultTab] || contentData.shopall;
    }
  })();
