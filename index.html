<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SHOP ALL FREE FIRE • TRUNGSANG X CHEAT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0309;
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* Nền đỏ nhẹ & hiệu ứng lấp lánh */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 40%, rgba(220, 20, 60, 0.25) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(255, 80, 80, 0.2) 0%, transparent 55%),
                  #13000c;
      z-index: -2;
    }

    /* Canvas tuyết rơi */
    #snowCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Khung chính */
    .main-container {
      width: 100%;
      max-width: 700px;
      margin: 20px auto;
      padding: 20px 18px;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Loading screen (màn hình chờ 0-100%) */
    .loader-screen {
      background: rgba(10, 0, 8, 0.92);
      backdrop-filter: blur(12px);
      border: 2px solid #ff4d6d;
      border-radius: 40px;
      padding: 30px 25px;
      text-align: center;
      width: 100%;
      box-shadow: 0 0 35px #ff1e4d, 0 15px 35px rgba(0,0,0,0.7);
      transition: opacity 0.6s ease;
    }

    .shop-title {
      font-size: clamp(2.2rem, 10vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff5f0;
      text-shadow: 0 0 15px #ff9f9f, 0 0 40px #ff3366, 0 0 80px #c0003c;
      margin-bottom: 15px;
      line-height: 1.2;
      animation: softGlowPulse 2.2s infinite alternate;
    }

    .brand-sub {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe6f0, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px #ff4770;
      margin: 10px 0 20px;
    }

    .progress-wrapper {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 50px;
      height: 30px;
      width: 90%;
      margin: 18px auto;
      border: 2px solid #ff6b81;
      box-shadow: 0 0 25px #ff2e4c;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a9e, #ff1e4d, #ff5e7a);
      box-shadow: 0 0 30px #ff1e4d;
      border-radius: 50px;
      transition: width 0.1s linear;
    }

    .progress-text {
      font-weight: bold;
      font-size: 1.3rem;
      color: #ffdae1;
      text-shadow: 0 0 15px #ff3b5c;
      margin-top: 8px;
    }

    .status-message {
      font-size: 1.5rem;
      font-weight: 700;
      color: #b4f0ff;
      text-shadow: 0 0 18px #00c8ff, 0 0 35px #0099cc;
      margin: 15px 0 5px;
      letter-spacing: 1px;
    }

    /* Shop chính (ẩn cho đến khi load xong) */
    .shop-interface {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    /* Viền ngoài phát sáng xanh nhạt cho toàn shop */
    .shop-card {
      background: rgba(18, 2, 12, 0.8);
      backdrop-filter: blur(18px);
      border: 2px solid #70e0ff;
      border-radius: 50px;
      padding: 25px 20px;
      width: 100%;
      box-shadow: 0 0 35px #6bd4ff, 0 10px 40px rgba(0,160,220,0.5);
      margin-bottom: 25px;
      color: #f0fcff;
    }

    .glow-text {
      color: #c5f0ff;
      text-shadow: 0 0 18px #3eb5ff, 0 0 30px #1e90ff;
    }

    h2, h3 {
      color: #fff0f5;
      text-shadow: 0 0 18px #ff99aa, 0 0 30px #ff3366;
    }

    /* Nút bottom nav */
    .bottom-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      width: 100%;
    }

    .tag-btn {
      background: rgba(20, 5, 15, 0.8);
      backdrop-filter: blur(16px);
      border: 2px solid #70e0ff;
      color: #d4f4ff;
      padding: 14px 18px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 0 18px #4dc3ff;
      text-shadow: 0 0 8px #a0e0ff;
      flex: 1 1 auto;
      min-width: 90px;
    }

    .tag-btn:hover {
      background: #ff2e55;
      border-color: #ffb3c6;
      box-shadow: 0 0 35px #ff3366;
      color: white;
      transform: translateY(-2px);
    }

    /* Khu vực nội dung hiển thị khi click */
    .content-area {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 20px;
      border: 1px solid #7ad0ff;
      box-shadow: 0 0 35px #2499ff;
      width: 100%;
      min-height: 200px;
      color: #f0f9ff;
      transition: 0.25s;
      font-size: 1rem;
      line-height: 1.7;
      white-space: pre-line;
    }

    .product-item {
      margin: 18px 0;
      border-bottom: 1px dashed #5ec5ff;
      padding-bottom: 12px;
    }

    .product-name {
      font-weight: 800;
      font-size: 1.3rem;
      color: #ffdae9;
      text-shadow: 0 0 18px #ff2e63;
    }

    .price {
      color: #b5f0ff;
      font-weight: bold;
    }

    a {
      color: #7bd5ff;
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px dotted #6ec8ff;
    }

    @keyframes softGlowPulse {
      0% { text-shadow: 0 0 15px #ff9f9f, 0 0 40px #ff3366; }
      100% { text-shadow: 0 0 30px #ffb3b3, 0 0 75px #ff0048; }
    }

    @media (max-width: 500px) {
      .tag-btn {
        padding: 10px 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

      <div class="progress-text" id="progressPercent">0%</div>

    </div>

    <!-- Giao diện chính shop (ban đầu ẩn) -->
    <div class="shop-interface" id="shopInterface">
      <div class="shop-card">
        <h2 style="font-size:2.2rem; text-align:center;">✨ SHOP ALL FREE FIRE ✨</h2>
        <p style="text-align:center; font-weight:bold; color:#b3edff;">TRUNGSANG X CHEAT🚀💹</p>
      </div>

      <!-- Thanh điều hướng dưới -->
      <div class="bottom-nav">

        <button class="tag-btn" data-tag="admin">👑 THÔNG TIN ADMIN</button>
      </div>

      <!-- Nội dung hiển thị động -->
      <div class="content-area" id="dynamicContent">
        <p style="color:#b0e5ff; text-align:center;">✨ Chọn một mục bên dưới để xem chi tiết ✨</p>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- HIỆU ỨNG TUYẾT RƠI ----------
      const canvas = document.getElementById('snowCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let snowflakes = [];

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Snowflake {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * -height;
          this.radius = Math.random() * 3.5 + 1.2;
          this.speed = Math.random() * 1.8 + 0.6;
          this.wind = Math.random() * 0.5 - 0.25;
          this.opacity = Math.random() * 0.7 + 0.3;
        }
        update() {
          this.y += this.speed;
          this.x += this.wind;
          if (this.y > height + 10 || this.x > width + 20 || this.x < -20) {
            this.reset();
            this.y = -10;
          }
        }
        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 250, 250, ${this.opacity})`;
          ctx.shadowColor = '#b3e5ff';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.shadowColor = 'transparent';
        }
      }

      function initSnow(flakeCount = 130) {
        snowflakes = [];
        for (let i = 0; i < flakeCount; i++) {
          snowflakes.push(new Snowflake());
        }
      }
      initSnow(120);

      function animateSnow() {
        ctx.clearRect(0, 0, width, height);
        for (let flake of snowflakes) {
          flake.update();
          flake.draw(ctx);
        }
        requestAnimationFrame(animateSnow);
      }
      animateSnow();

      // ---------- LOADING 0% -> 100% ----------
      const loaderScreen = document.getElementById('loaderScreen');
      const shopInterface = document.getElementById('shopInterface');
      const progressFill = document.getElementById('progressFill');
      const progressPercent = document.getElementById('progressPercent');
      const statusMsg = document.getElementById('statusMsg');

      let percent = 0;
      const loadingInterval = setInterval(() => {
        percent += Math.floor(Math.random() * 5) + 2;
        if (percent > 100) percent = 100;

        progressFill.style.width = percent + '%';
        progressPercent.textContent = percent + '%';

        if (percent < 45) {
          statusMsg.textContent = 'Đang chuẩn bị shop...';
        } else if (percent < 85) {
          statusMsg.textContent = 'Sắp hoàn thành...';
        } else if (percent < 100) {
          statusMsg.textContent = 'Thành công.';
        }

        if (percent === 100) {
          clearInterval(loadingInterval);
          statusMsg.textContent = '✅ Thành công! Chào mừng bạn.';
          // Sau khi đạt 100%, ẩn loader, hiện shop sau 0.4s

            loaderScreen.style.display = 'none';
            shopInterface.style.display = 'flex';

          <div class="product-item"><span class="product-name">💠 MIGUL BASIC VN</span><br>
            <span class="price">65.000 VNĐ 1 DAY🛍️</span><br>
            <span class="price">145.000 VNĐ 7 DAY🛍️</span><br>
            <span class="price">300.000 VNĐ 30 DAY🛍️</span>
          </div>
          <div class="product-item"><span class="product-name">💠 MIGUL PRO VN</span><br>
            <span class="price">20.000 VNĐ 1 GIỜ🛍️</span><br>

            - Fix lag tạm thời 1-3 giây, bắn định thoải mái. ANTIBAN✅ 100%
          </div>

            1 ACC (LV 5-8), ACC RANK KC TC (LV 8-11), leo rank tử chiến, no ban ib

        admin: `
          <div style="font-size:1.2rem; font-weight:bold;">👑 THÔNG TIN ADMIN 👾</div>

      // Xử lý click nút tag với delay 1-3 giây load nội dung
      const tagButtons = document.querySelectorAll('.tag-btn');
      tagButtons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const tag = this.dataset.tag;
          if (!tag) return;
          // Hiển thị trạng thái đang tải
          contentArea.innerHTML = '<p style="color:#a5e9ff; text-align:center;">⏳ Đang tải nội dung...</p>';

          // Delay ngẫu nhiên 1-3 giây
          const delay = Math.floor(Math.random() * 2000) + 1000; // 1000-3000ms
          setTimeout(() => {
            if (dataMap[tag]) {
              contentArea.innerHTML = dataMap[tag];
            } else {
              contentArea.innerHTML = '<p>Không tìm thấy dữ liệu.</p>';
            }
            // Thêm hiệu ứng nhẹ
            contentArea.style.transition = '0.2s';
            contentArea.style.boxShadow = '0 0 45px #40b0ff';
            setTimeout(() => { contentArea.style.boxShadow = '0 0 35px #2499ff'; }, 300);
          }, delay);
        });
      });

      // Phòng trường hợp load lại trang
    })();
  </script>
</body>
</html>
